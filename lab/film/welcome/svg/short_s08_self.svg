  <text x="120" y="1002" font-family="Consolas,Menlo,monospace" font-size="21" fill="#9aa6b6">lab/film/welcome/qc/verify_welcome_film.cjs — and its mutation suite, which breaks the film on purpose to see whether the check notices</text>
  
