  <text x="140" y="260" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">- **Falsify:** perturb any update equation (e.g. use `ln(B·s)` instead of `(ln B)·s`)</text>
