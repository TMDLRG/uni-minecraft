  <text x="140" y="260" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">  The brain never sees raw world state (the body computes the senses); the body</text>
  <text x="140" y="294" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">  never sees beliefs. Lockstep: one sense line → one action line. The learned</text>
  <text x="140" y="328" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">  model is persisted (`:memory_path`) so memories survive death (P6).</text>
