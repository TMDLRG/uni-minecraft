<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0d1017"/>
  <rect x="0" y="0" width="14" height="1080" fill="#9a92ee"/>
  <text x="120" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" letter-spacing="3"
        fill="#9a92ee" font-weight="600">VERBATIM FROM THE SOURCE</text>
  <text x="120" y="176" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" fill="#dfe5ee">Why the door has no key — the module's own heading</text>
  <rect x="112" y="214" width="1696" height="346" rx="10" fill="#141923" stroke="#242c3a"/>
  <text x="140" y="260" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">// THE TOKEN IS NOT MINTED HERE, ON PURPOSE</text>
  <text x="140" y="294" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">// ----------------------------------------</text>
  <text x="140" y="328" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">// Minting is what OPENS the door, and opening the door is S6 and the operator's. This</text>
  <text x="140" y="362" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">module only</text>
  <text x="140" y="396" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">// refuses. Until a mint exists and he rules ADR-0008, `mayGoLive()` refuses EVERY</text>
  <text x="140" y="430" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">path — which is</text>
  <text x="140" y="464" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">// the safe direction, and is exactly the state F31 describes: go-live requested by an</text>
  <text x="140" y="498" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">agent is</text>
  <text x="140" y="532" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">// refused, and there is currently no non-agent to request it.</text>
  <text x="120" y="984" font-family="Consolas,Menlo,monospace" font-size="22" fill="#9aa6b6">viewer/golive_guard.cjs:38-43</text>
  <text x="120" y="1022" font-family="Consolas,Menlo,monospace" font-size="19" fill="#9aa6b6">sha256 85fe9ef1aec9ba11f2bebd39a2d055c70d23cb6a8f7fcb24…</text>
</svg>