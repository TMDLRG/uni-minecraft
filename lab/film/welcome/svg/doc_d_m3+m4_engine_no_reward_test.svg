  <text x="140" y="260" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">  test "#15 eval metrics do not backdoor a reward signal" do</text>
  <text x="140" y="294" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">    m = SP.Eval.run_episode(seed: 1, agent: SP.Baselines.Random, max_ticks: 40) |&gt;</text>
  <text x="140" y="328" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">SP.Eval.episode_metrics()</text>
  <text x="140" y="362" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">    refute Enum.any?(Map.keys(m), &amp;(&amp;1 in [:reward, :score, :return, :fitness]))</text>
