<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0d1017"/>
  <rect x="0" y="0" width="14" height="1080" fill="#d9a441"/>
  <text x="120" y="130" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" letter-spacing="3"
        fill="#d9a441" font-weight="600">INTENT — NOT A MEASURED CLAIM</text>
  <text x="120" y="300" font-family="Georgia,serif" font-size="52" fill="#dfe5ee">Worldwide peace through free and open understanding.</text>
  <text x="120" y="382" font-family="Georgia,serif" font-size="52" fill="#dfe5ee">The public pursuit and ownership of</text>
  <text x="120" y="464" font-family="Georgia,serif" font-size="52" fill="#dfe5ee">General Universal Natural Intelligence.</text>
  <text x="120" y="546" font-family="Georgia,serif" font-size="52" fill="#dfe5ee">The end of extract and extortion.</text>
  <text x="120" y="628" font-family="Georgia,serif" font-size="52" fill="#dfe5ee">Making safe all wombs, and Gaia —</text>
  <text x="120" y="710" font-family="Georgia,serif" font-size="52" fill="#dfe5ee">earth, our solar system, and beyond.</text>
  <text x="120" y="1010" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" fill="#9aa6b6">Nothing on this frame was measured. It is what the work is for.</text>
</svg>