<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0d1017"/>
  <rect x="0" y="0" width="14" height="1080" fill="#9a92ee"/>
  <text x="120" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" letter-spacing="3"
        fill="#9a92ee" font-weight="600">VERBATIM FROM THE SOURCE</text>
  <text x="120" y="176" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" fill="#dfe5ee">The module's own heading — not injective, a material cannot be read backwards</text>
  <rect x="112" y="214" width="1696" height="210" rx="10" fill="#141923" stroke="#242c3a"/>
  <text x="140" y="260" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">  ## Not injective — a material cannot be read backwards</text>
  <text x="140" y="294" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve"></text>
  <text x="140" y="328" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">  §8.2 gives `REDUCED_MODEL` and `DERIVED` **one row and one material**. Six truth</text>
  <text x="140" y="362" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">  classes map onto five materials, so appearance does not determine provenance. A</text>
  <text x="140" y="396" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">  surface must not infer a truth class from a material.</text>
  <text x="120" y="984" font-family="Consolas,Menlo,monospace" font-size="22" fill="#9aa6b6">lib/sp/control_plane/scene.ex:238-242</text>
