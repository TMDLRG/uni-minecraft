<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0d1017"/>
  <rect x="0" y="0" width="14" height="1080" fill="#9a92ee"/>
  <text x="120" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" letter-spacing="3"
        fill="#9a92ee" font-weight="600">VERBATIM FROM THE SOURCE</text>
  <text x="120" y="176" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" fill="#dfe5ee">Why it has not simply been opened — from the corpus's own exposure decision</text>
  <rect x="112" y="214" width="1696" height="278" rx="10" fill="#141923" stroke="#242c3a"/>
  <text x="140" y="260" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">- **Private -&gt; public** is one command, and takes effect in seconds.</text>
  <text x="140" y="294" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">- **Public -&gt; private** is also one command — **and it does not undo the first one.**</text>
  <text x="140" y="328" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve"></text>
  <text x="140" y="362" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">Withdrawing a URL removes future access. It does not remove what was already taken.</text>
  <text x="140" y="396" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">Between the</text>
  <text x="140" y="430" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">moment a path is public and the moment you withdraw it, anything that fetched the page</text>
  <text x="140" y="464" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">keeps it:</text>
  <text x="120" y="984" font-family="Consolas,Menlo,monospace" font-size="22" fill="#9aa6b6">deploy/PUBLISH-DECISION.md:22-26</text>
  <text x="120" y="1022" font-family="Consolas,Menlo,monospace" font-size="19" fill="#9aa6b6">sha256 31eaf8dcdcae206b83ba3473ba70a0608810314317563257…</text>
</svg>