<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#0d1017"/>
  <rect x="0" y="0" width="14" height="1080" fill="#9a92ee"/>
  <text x="120" y="122" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" letter-spacing="3"
        fill="#9a92ee" font-weight="600">VERBATIM FROM THE SOURCE</text>
  <text x="120" y="176" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" fill="#dfe5ee">That page is written by a program, and it says so in its own opening paragraph</text>
  <rect x="112" y="214" width="1696" height="380" rx="10" fill="#141923" stroke="#242c3a"/>
  <text x="140" y="260" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">**GENERATED. DO NOT EDIT.** Written by `viewer/generate_limitations.cjs` from</text>
  <text x="140" y="294" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">`@limitation`</text>
  <text x="140" y="328" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">annotations that sit at the line each limitation lives on, and checked by the</text>
  <text x="140" y="362" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">`limitations-doc` gate, which regenerates this file and refuses any difference.</text>
  <text x="140" y="396" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve"></text>
  <text x="140" y="430" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">A hand-written limitations page drifts in one direction: nobody forgets to delete a</text>
  <text x="140" y="464" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">limit</text>
  <text x="140" y="498" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">that has been fixed, and everybody forgets to add the one they just found. So this one</text>
  <text x="140" y="532" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">is</text>
  <text x="140" y="566" font-family="Consolas,Menlo,monospace" font-size="24" fill="#dfe5ee" xml:space="preserve">not written. **A derived doc cannot drift.**</text>
  <text x="120" y="984" font-family="Consolas,Menlo,monospace" font-size="22" fill="#9aa6b6">docs/control-plane/LIMITATIONS.md:3-9</text>
  <text x="120" y="1022" font-family="Consolas,Menlo,monospace" font-size="19" fill="#9aa6b6">sha256 6d779a3680b3377d2d7cf34d52b8bbe2a90847a6fb95635f…</text>
</svg>