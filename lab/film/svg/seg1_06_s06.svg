<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g5" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g5)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="170" letter-spacing="14" fill="#e6edf3" font-weight="bold">LOOKING</text>
  <rect x="660" y="420" width="600" height="3" fill="#89b4fa" opacity="0.55"/>
  <text x="960" y="500" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">one idea — and the way we test what we believe</text>
  <rect x="0" y="755" width="1920" height="325" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="755" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="811" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">This film is about the cure for that — which is simply looking. It is about one big,</text>
  <text x="960" y="850" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">hopeful idea, and about the gentle, stubborn discipline we use to test any idea fairly, no</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">matter how much we want it to be true. Including, hardest of all, our own ideas.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">हा चित्रपट त्यावरील उपचाराबद्दल आहे — जो म्हणजे फक्त पाहणे. हा एका मोठ्या, आशादायक</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">कल्पनेबद्दल आहे, आणि कोणत्याही कल्पनेची, ती कितीही खरी असावी असे वाटले तरी,</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रामाणिकपणे चाचणी घेण्याच्या सौम्य, हट्टी शिस्तीबद्दल आहे. आणि सर्वात कठीण म्हणजे</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">— आपल्याच कल्पनांची.</text>
</svg>