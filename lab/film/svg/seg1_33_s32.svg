<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g32" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#13111c"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g32)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#cdd6f4" font-style="italic">"Compare it to the strongest idea we already have."</text>
  
  <rect x="0" y="701" width="1920" height="379" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="701" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">There is one last habit, quiet but absolutely decisive. We never test a new idea against a</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">weak, cartoon version of the old one. We compare it, always, to the strongest, best-tuned</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">explanation we already possess. It is easy to look brilliant beside a strawman. It means</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">nothing. The only victory that counts is a victory over the real thing, at its very best.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">एक शेवटची सवय आहे, शांत पण अत्यंत निर्णायक. आपण नवीन कल्पनेची चाचणी जुन्याच्या</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">कमकुवत, व्यंगचित्रासारख्या आवृत्तीशी कधीच घेत नाही. आपण ती नेहमी आपल्याकडे आधीच</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">असलेल्या सर्वात मजबूत, उत्तम जुळवलेल्या स्पष्टीकरणाशी तुलना करतो. भुसकटाशेजारी</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तेजस्वी दिसणे सोपे आहे. त्याला काहीच अर्थ नाही. मोजला जाणारा एकमेव विजय म्हणजे</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">खऱ्या गोष्टीवर, तिच्या सर्वोत्तम रूपात मिळवलेला विजय.</text>
</svg>