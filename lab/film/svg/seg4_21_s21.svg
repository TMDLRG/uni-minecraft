<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g20" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g20)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
<text x="960" y="276" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">A real engine.</text>
<text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">A real ancestor.</text>
<text x="960" y="444" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#a371f7" font-weight="bold">A real shared inheritance.</text>
  <rect x="0" y="599" width="1920" height="481" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="599" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And what gives this metaphor more grace than most is that the underlying science is</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">unusually close to it. There really is a single mechanism in every living thing we have</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">looked at. There really was a single common ancestor. There really is, in a perfectly</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">literal scientific sense, a shared inheritance running through every cell on Earth. The</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">poetry is not refuted by the laboratory. The poetry is, in this rare case, almost reading</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">the same paragraph the laboratory is reading.</text>
  <rect x="800" y="835" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि या रूपकाला बहुतेक रूपकांपेक्षा अधिक कृपा देणारी गोष्ट म्हणजे त्याखालील विज्ञान</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">त्याच्या असामान्यपणे जवळ आहे. आपण पाहिलेल्या प्रत्येक जिवंत गोष्टीत खरोखर एक एकल</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">यंत्रणा आहे. खरोखर एक एकल सामायिक पूर्वज होता. खरोखर, अगदी शाब्दिक वैज्ञानिक</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">अर्थाने, पृथ्वीवरील प्रत्येक पेशीतून जाणारा एक सामायिक वारसा आहे. कवितेचे</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रयोगशाळेने खंडन केले जात नाही. कविता, या दुर्मिळ प्रसंगी, प्रयोगशाळा वाचत आहे</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तोच परिच्छेद जवळजवळ वाचत आहे.</text>
</svg>