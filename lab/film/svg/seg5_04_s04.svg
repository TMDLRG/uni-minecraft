<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g3" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#1a1822"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g3)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="3">what we let go — gently, without shame</text>
  <g font-family="ui-sans-serif,'Segoe UI',sans-serif">
    <rect x="240" y="220" width="1440" height="80" rx="12" fill="#1c2128" stroke="#f85149" stroke-width="2"/>
    <text x="280" y="272" font-size="30" fill="#f85149" font-weight="bold">X</text>
    <text x="360" y="272" font-size="28" fill="#cdd6f4">Ozone is alive, or required for all life</text>

    <rect x="240" y="320" width="1440" height="80" rx="12" fill="#1c2128" stroke="#f85149" stroke-width="2"/>
    <text x="280" y="372" font-size="30" fill="#f85149" font-weight="bold">X</text>
    <text x="360" y="372" font-size="28" fill="#cdd6f4">Air pressure replaces gravity</text>

    <rect x="240" y="420" width="1440" height="80" rx="12" fill="#1c2128" stroke="#f85149" stroke-width="2"/>
    <text x="280" y="472" font-size="30" fill="#f85149" font-weight="bold">X</text>
    <text x="360" y="472" font-size="28" fill="#cdd6f4">Oxygen is required for all life</text>
  </g>
  <text x="960" y="640" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#9aa7b4" font-style="italic">Three real claims. Three honest "no"s. Each one knowledge.</text>
  <rect x="0" y="599" width="1920" height="481" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="599" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And here is what we let go of, on the way. The grandest reading of ozone — that it is</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">life, or required for all life. The whole pressure-replaces-gravity claim. The strong</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">reading of breath — that oxygen is required for any life anywhere. Three real claims.</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Three honest no's. Each of those no's, I want you to feel, is itself a kind of knowledge.</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">It tells the next traveler, truthfully, where not to look — and so saves them the same</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">years we just spent looking there.</text>
  <rect x="800" y="835" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि वाटेत आपण काय सोडले ते इथे. ओझोनचे सर्वात भव्य वाचन — की ते जीवन आहे, किंवा</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">सर्व जीवनासाठी आवश्यक. संपूर्ण दाब-गुरुत्वाकर्षण-बदलून-टाकतो दावा. श्वासाचे मजबूत</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">वाचन — की कोणत्याही जीवनासाठी कुठेही ऑक्सिजन आवश्यक आहे. तीन खरे दावे. तीन</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रामाणिक 'नाही'. त्या प्रत्येक 'नाही' मध्ये, मला तुम्हाला जाणवायचे आहे, ते स्वतः</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">एक प्रकारचे ज्ञान आहे. ते पुढच्या प्रवाशाला, खरेपणाने, कुठे पाहू नये ते सांगते —</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि म्हणून त्यांना आपण नुकत्याच तिथे पाहण्यात घालवलेल्या त्याच वर्षांची बचत करते.</text>
</svg>