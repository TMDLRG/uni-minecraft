  <text x="540" y="180" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="30" letter-spacing="6" fill="#6c7393">TRAVELERS · प्रवासी</text>
  <text x="540" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="76" font-weight="bold" fill="#e6edf3">Does your weight</text>
<text x="540" y="452" text-anchor="middle" font-family="Georgia,serif" font-size="76" font-weight="bold" fill="#e6edf3">come from gravity —</text>
<text x="540" y="544" text-anchor="middle" font-family="Georgia,serif" font-size="76" font-weight="bold" fill="#e6edf3">or from the air?</text>
  <text x="540" y="820" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="56" fill="#f9e2af" font-weight="bold">7 worlds tested</text>
  <text x="540" y="1120" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="40" fill="#cdd6f4">On the airless Moon, you'd still weigh</text>
<text x="540" y="1172" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="40" fill="#cdd6f4">something. That one test settles it.</text>
  <text x="540" y="1252" text-anchor="middle" font-family="Nirmala UI,'Mangal',sans-serif" font-size="36" fill="#9aa7b4">हवारहित चंद्रावरही तुमचे वजन असेल.</text>
<text x="540" y="1302" text-anchor="middle" font-family="Nirmala UI,'Mangal',sans-serif" font-size="36" fill="#9aa7b4">ती एक चाचणी हे ठरवते.</text>
