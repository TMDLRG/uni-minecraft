<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g16" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g16)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
<text x="960" y="276" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">Oxygen is one menu item.</text>
<text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">Life has six.</text>
<text x="960" y="444" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#f85149" font-weight="bold">Reading C — contradicted.</text>
  <rect x="0" y="701" width="1920" height="379" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="701" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And — as we saw in segment two — life on Earth had already been thriving for at least a</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">billion years before there was any meaningful oxygen in the atmosphere at all. The</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">proton-gradient engine was running long before oxygen was invented as a fuel. Reading C,</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">the bold one — life requires oxygen — is, by the kingdoms of life themselves,</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">contradicted. Class X.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि — दुसऱ्या भागात आपण पाहिले — पृथ्वीवरील जीवन वातावरणात कोणताही अर्थपूर्ण</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ऑक्सिजन येण्याआधी किमान एक अब्ज वर्षे भरभराटीत होते. ऑक्सिजन इंधन म्हणून शोधले</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जाण्याच्या खूप आधी प्रोटॉन-ग्रेडियंट इंजिन चालू होते. वाचन C, धाडसी एक — जीवनाला</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ऑक्सिजन आवश्यक आहे — जीवनाच्या राज्यांनी स्वतःच खोडलेले आहे. वर्ग X.</text>
</svg>