<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g7" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g7)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="160" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="3">the proton-motive force (Mitchell, 1961)</text>
  <text x="960" y="360" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="76" fill="#e6edf3">Δp  =  Δψ  −  (59 mV)·ΔpH</text>
  <text x="960" y="440" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#9aa7b4">the gradient's energy = the charge difference + the pH difference</text>
  <line x1="500" y1="500" x2="1420" y2="500" stroke="#30363d" stroke-width="2"/>
  <text x="960" y="580" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="38" fill="#a6e3a1">at 298 K, the Nernst factor = 59.16 mV per pH unit</text>
  <text x="960" y="650" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#6c7393">Nobel Prize in Chemistry, 1978</text>
  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Mitchell wrote it down as a single equation, which became known as the proton-motive</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">force. It says: the energy in the gradient equals the voltage difference across the</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">membrane plus the pH difference across the membrane, weighted by a tiny conversion factor</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">of fifty-nine millivolts per pH unit at body temperature. That little number, fifty-nine,</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">comes from the same Nernst arithmetic that runs every battery on Earth.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">मिशेलने ते एका समीकरणात लिहिले, जे प्रोटॉन-मोटिव्ह फोर्स म्हणून ओळखले जाऊ लागले.</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ते म्हणते: गुरुत्वातील ऊर्जा म्हणजे पडद्याच्या आरपार व्होल्टेज फरक अधिक पडद्याच्या</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आरपार pH फरक, शरीराच्या तापमानावर प्रति pH एकक एकोणसाठ मिलीव्होल्ट या लहान रूपांतर</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">घटकाने वजन केलेले. तो छोटा आकडा, एकोणसाठ, पृथ्वीवरील प्रत्येक बॅटरी चालवणाऱ्या</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">त्याच नर्न्स्ट गणितातून येतो.</text>
</svg>