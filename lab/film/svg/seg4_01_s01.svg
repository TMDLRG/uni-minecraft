<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g0" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g0)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="90" letter-spacing="6" fill="#e6edf3" font-weight="bold">SEGMENT FOUR</text>
  <rect x="660" y="420" width="600" height="3" fill="#a6e3a1" opacity="0.55"/>
  <text x="960" y="500" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">The Breath of Life</text>
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">We come now to the third and last of the three bold claims — and I have been quietly</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">waiting to bring you to this one, because of the three it is, in some ways, the most</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">beautiful, and the most personal. It is the claim about life itself. The claim that there</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">is a single thread, a single flow, running through every living thing on this Earth.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आता आपण तीन धाडसी दाव्यांपैकी तिसऱ्या आणि शेवटच्या दाव्याकडे येतो — आणि मी</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तुम्हाला याकडे आणण्याची शांतपणे वाट पाहत होतो, कारण तिघांत हा, काही प्रकारे,</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">सर्वात सुंदर आणि सर्वात वैयक्तिक आहे. हा दावा जीवनाबद्दलच आहे. की या पृथ्वीवरील</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रत्येक जिवंत गोष्टीतून एक एकच धागा, एक एकच प्रवाह वाहत आहे.</text>
</svg>