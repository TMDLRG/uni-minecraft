<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g10" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g10)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">the test bench the solar system gives us</text>

  <text x="100" y="320" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#cdd6f4">Surface pressure across these seven worlds spans</text>
  <text x="960" y="430" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="100" fill="#f9e2af" font-weight="bold">~10¹⁶</text>
  <text x="960" y="490" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#9aa7b4">ten quadrillion-fold</text>

  <line x1="700" y1="540" x2="1220" y2="540" stroke="#30363d" stroke-width="2"/>

  <text x="960" y="610" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#cdd6f4">Surface gravity spans only a factor of</text>
  <text x="960" y="690" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="60" fill="#a6e3a1" font-weight="bold">~19×</text>
  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Before we run the test, look at the range our test bench gives us. From the Moon's</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">near-vacuum to the crush of Venus, the surface pressure across these seven worlds spans</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">about ten thousand trillion to one. Sixteen orders of magnitude. Meanwhile, the surface</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">gravity across the same seven worlds spans only a factor of about nineteen. The pressure</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">varies by a factor of ten quadrillion. The gravity varies by a factor of nineteen.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">चाचणी चालवण्याआधी, आपल्या चाचणी बेंचने आपल्याला दिलेली श्रेणी पहा. चंद्राच्या</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जवळ-शून्य पासून शुक्राच्या चिरडण्यापर्यंत, या सात जगांवरील पृष्ठीय दाब साधारण</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">दहा-हजार-कोटी-कोटी ते एक इतका पसरतो. सोळा परिमाण-कोटी. दरम्यान, त्याच सात जगांवरील</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">पृष्ठीय गुरुत्वाकर्षण फक्त सुमारे एकोणीसच्या घटकाने पसरते. दाब</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">दहा-कोटी-कोटी-कोटीच्या घटकाने बदलतो. गुरुत्वाकर्षण एकोणीसच्या घटकाने बदलते.</text>
</svg>