<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g4" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g4)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="3">what we preserve as metaphor — with respect</text>
  <g font-family="Georgia,serif">
    <rect x="240" y="220" width="1440" height="100" rx="14" fill="#1c2128" stroke="#a371f7" stroke-width="2"/>
    <text x="290" y="288" font-size="34" fill="#a371f7" font-weight="bold">D</text>
    <text x="370" y="288" font-size="32" fill="#cdd6f4" font-style="italic">"the breath of a living world"</text>

    <rect x="240" y="350" width="1440" height="100" rx="14" fill="#1c2128" stroke="#a371f7" stroke-width="2"/>
    <text x="290" y="418" font-size="34" fill="#a371f7" font-weight="bold">D</text>
    <text x="370" y="418" font-size="32" fill="#cdd6f4" font-style="italic">"a single thread running through everything alive"</text>

    <rect x="240" y="480" width="1440" height="100" rx="14" fill="#1c2128" stroke="#a371f7" stroke-width="2"/>
    <text x="290" y="548" font-size="34" fill="#a371f7" font-weight="bold">D</text>
    <text x="370" y="548" font-size="32" fill="#cdd6f4" font-style="italic">"life is made of travelers"</text>
  </g>
  <text x="960" y="650" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#6c7393">these are not failed science. they are language doing its honest work.</text>
  <rect x="0" y="599" width="1920" height="481" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="599" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And here is what we preserved, with respect. The breath of a living world. A single thread</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">running through everything alive. Life made of travelers. These were never failed</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">scientific claims. They were always — and they remain — language doing its honest work.</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">They orient a human being toward something larger than themselves. They are not refuted by</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">our table; they are not on the same map as our table. They run beside it, in their own</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">language, with their own dignity.</text>
  <rect x="800" y="835" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि इथे आदराने जपलेले आहे. एका जिवंत जगाचा श्वास. प्रत्येक जिवंत गोष्टीतून जाणारा</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">एक धागा. प्रवाशांचे बनलेले जीवन. ही कधीही अपयशी वैज्ञानिक दावे नव्हते. ती नेहमीच</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">होती — आणि ती आहेत — आपले प्रामाणिक काम करणारी भाषा. ती मनुष्याला स्वतःपेक्षा</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">मोठ्या कशाकडे तरी दिशा देतात. आपल्या तक्त्याने त्यांचे खंडन केले जात नाही; ती</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आपल्या तक्त्याच्या त्याच नकाशावर नाहीत. ती त्याच्या शेजारी, स्वतःच्या भाषेत,</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">स्वतःच्या प्रतिष्ठेने धावतात.</text>
</svg>