<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g23" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g23)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
<text x="960" y="234" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">It graduated not because</text>
<text x="960" y="318" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">it was bold —</text>
<text x="960" y="402" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">but because evidence,</text>
<text x="960" y="486" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#a6e3a1" font-weight="bold">and a mechanism, arrived.</text>
  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">But notice — carefully — why it finally graduated. Not because it was bold. Not because</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Wegener wanted it badly enough, or believed it hard enough; he wanted it and believed it</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">his whole life, and that changed nothing. It graduated for one reason only: new evidence,</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">a real mechanism, and fresh predictions that came true. That is the only door a bold idea</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">can ever walk through.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">पण लक्षात घ्या — काळजीपूर्वक — ते अखेर का स्वीकारले गेले. ते धाडसी होते म्हणून</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">नाही. वेगेनरला ते पुरेसे हवे होते किंवा त्याने पुरेसा विश्वास ठेवला म्हणून नाही;</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">त्याला ते आयुष्यभर हवे होते आणि त्याने विश्वास ठेवला, आणि त्याने काहीच बदलले नाही.</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ते एकाच कारणाने स्वीकारले गेले: नवीन पुरावा, खरी यंत्रणा, आणि खरी ठरलेली नवी</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">भाकिते. धाडसी कल्पना जिथून आत येऊ शकते तो एकमेव दरवाजा तोच आहे.</text>
</svg>