<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g26" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g26)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
<text x="960" y="234" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">A claim is not judged</text>
<text x="960" y="318" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">by who makes it,</text>
<text x="960" y="402" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">or how strange it sounds —</text>
<text x="960" y="486" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#e6edf3" font-weight="bold">only by the test.</text>
  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">So this is the lesson we carry, with real care, into our own three claims. A claim is</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">never judged by who makes it, or by their fame, or their poverty, or their certainty. It</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">is not judged by how warm it feels, or how strange it sounds. It is judged — only, ever,</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">and always — by the test it can or cannot survive. Wegener's idea survived. Le Sage's did</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">not. Both were treated honestly. That is all we owe anyone.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तर हा धडा आपण, खऱ्या काळजीने, आपल्या तीन दाव्यांमध्ये घेऊन जातो. दावा कधीही तो कोण</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">करतो, त्यांची कीर्ती, त्यांची गरिबी, किंवा त्यांची खात्री यावरून ठरत नाही. तो कसा</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ऊबदार वाटतो किंवा किती विचित्र वाटतो यावरून ठरत नाही. तो ठरतो — फक्त, नेहमी — तो</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">टिकवू शकतो की नाही त्या चाचणीवरून. वेगेनरची कल्पना टिकली. ल साजची टिकली नाही.</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">दोघांशीही प्रामाणिक वागले गेले. कोणाचेही आपण एवढेच देणे लागतो.</text>
</svg>