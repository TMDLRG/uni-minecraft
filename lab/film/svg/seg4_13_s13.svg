<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g12" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#13111c"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g12)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#cdd6f4" font-style="italic">"+0.82 volts of pull"</text>
  <text x="960" y="430" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#6c7393">oxygen's reduction potential</text>
  <rect x="0" y="565" width="1920" height="515" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="565" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="617" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">When the proton gradient drives the turbine and ATP is built, the cell needs somewhere to</text>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">dump the spent electrons at the end. Oxygen is exceptionally good at receiving them — it</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">pulls on electrons with a force we measure as plus-zero-point-eight-two volts, the highest</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">pull biology has ever found in a routinely-available molecule. The result is a metabolism</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">roughly ten times more efficient than anything that does not use oxygen. That is why</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">animals exist. That is why brains exist. That is why you are sitting here, breathing.</text>
  <rect x="800" y="801" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="841" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जेव्हा प्रोटॉन ग्रेडियंट टर्बाइन चालवतो आणि ATP बनवली जाते, तेव्हा पेशीला शेवटी</text>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">खर्च झालेले इलेक्ट्रॉन कुठेतरी टाकायला हवे. ऑक्सिजन ते स्वीकारण्यात अपवादात्मकपणे</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">चांगला आहे — तो इलेक्ट्रॉनना धन-शून्य-पूर्णांक-आठ-दोन व्होल्ट इतक्या बलाने ओढतो,</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जैविकशास्त्राने एका नियमितपणे उपलब्ध रेणूत आढळलेले सर्वोच्च खेच. परिणाम म्हणजे</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ऑक्सिजन न वापरणाऱ्या कोणत्याही गोष्टीपेक्षा सुमारे दहा पट अधिक कार्यक्षम चयापचय.</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">म्हणून प्राणी अस्तित्वात आहेत. म्हणून मेंदू अस्तित्वात आहेत. म्हणून तुम्ही इथे</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">बसून श्वास घेत आहात.</text>
</svg>