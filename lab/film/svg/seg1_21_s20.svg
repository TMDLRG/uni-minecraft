<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g20" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#0f1320"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g20)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <line x1="260" y1="300" x2="1660" y2="300" stroke="#30363d" stroke-width="3"/>
  <circle cx="500" cy="300" r="10" fill="#a6e3a1"/>
  <text x="500" y="250" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="30" fill="#a6e3a1">1912</text>
  <text x="960" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#e6edf3" font-weight="bold">A teacher says the continents move</text>
  <text x="960" y="520" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#9aa7b4">Alfred Wegener: the land itself drifts.</text>
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Consider Alfred Wegener. In 1912, this quiet German scientist stood up and proposed</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">something that sounded absurd: that the continents move. That Africa and South America had</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">once been pressed together, a single land, and had slowly, over ages, torn apart and</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">drifted to where we find them now.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आल्फ्रेड वेगेनरचा विचार करा. १९१२ मध्ये, या शांत जर्मन शास्त्रज्ञाने उभे राहून असे</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">काहीतरी मांडले जे हास्यास्पद वाटले: की खंड हलतात. की आफ्रिका आणि दक्षिण अमेरिका</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">एकेकाळी एकत्र दाबलेले होते, एकच भूमी, आणि युगानुयुगे हळूहळू फाटून आज आपल्याला</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">सापडतात तिथे सरकले.</text>
</svg>