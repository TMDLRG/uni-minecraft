<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g12" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g12)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="120" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="38" fill="#9aa7b4" letter-spacing="4">"Ozone = Life" is not one claim — it is five</text>

  <g font-family="ui-sans-serif,sans-serif">
    <rect x="240" y="210" width="1440" height="64" rx="10" fill="#1c2128" stroke="#cba6f7" stroke-width="2"/>
    <text x="280" y="252" font-size="30" fill="#cba6f7" font-weight="bold">1.</text>
    <text x="340" y="252" font-size="30" fill="#e6edf3">LITERAL — ozone <tspan font-style="italic" fill="#f38ba8">is</tspan> life, alive in itself</text>

    <rect x="240" y="290" width="1440" height="64" rx="10" fill="#1c2128" stroke="#cba6f7" stroke-width="2"/>
    <text x="280" y="332" font-size="30" fill="#cba6f7" font-weight="bold">2.</text>
    <text x="340" y="332" font-size="30" fill="#e6edf3">NECESSARY — ozone is required for any life, anywhere</text>

    <rect x="240" y="370" width="1440" height="64" rx="10" fill="#1c2128" stroke="#cba6f7" stroke-width="2"/>
    <text x="280" y="412" font-size="30" fill="#cba6f7" font-weight="bold">3.</text>
    <text x="340" y="412" font-size="30" fill="#e6edf3">SHIELD — ozone protects life on modern Earth from UV</text>

    <rect x="240" y="450" width="1440" height="64" rx="10" fill="#1c2128" stroke="#cba6f7" stroke-width="2"/>
    <text x="280" y="492" font-size="30" fill="#cba6f7" font-weight="bold">4.</text>
    <text x="340" y="492" font-size="30" fill="#e6edf3">BIOSIGNATURE — ozone in an alien sky may signal life there</text>

    <rect x="240" y="530" width="1440" height="64" rx="10" fill="#1c2128" stroke="#cba6f7" stroke-width="2"/>
    <text x="280" y="572" font-size="30" fill="#cba6f7" font-weight="bold">5.</text>
    <text x="340" y="572" font-size="30" fill="#e6edf3">METAPHOR — the sky as the breath of a living world</text>
  </g>

  <text x="960" y="660" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#f9e2af" font-style="italic">we test each of the five — separately</text>
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">When somebody says ozone is life, they could mean any of at least five different things.</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">We have to lay them out, side by side, in plain English, before we can test any of them.</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Otherwise, the strong reading and the weak reading hide behind each other, and the</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">conversation can never end.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जेव्हा कोणी म्हणते की ओझोन हे जीवन आहे, तेव्हा त्याचा अर्थ कमीतकमी पाच वेगवेगळ्या</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">गोष्टींपैकी कोणतीही असू शकतो. कोणत्याही एकाची चाचणी घेण्यापूर्वी, आपल्याला त्या</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">साध्या इंग्रजीत, एकमेकांच्या बाजूला मांडाव्या लागतात. नाहीतर, मजबूत आणि कमकुवत</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">वाचने एकमेकांमागे लपतात, आणि संभाषण कधीच संपू शकत नाही.</text>
</svg>