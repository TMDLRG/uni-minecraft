<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g14" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g14)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <rect x="510" y="220" width="900" height="360" rx="18" fill="#1c2128" stroke="#cba6f7" stroke-width="3"/>
  <text x="960" y="310" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" fill="#cba6f7" letter-spacing="6">READING 1</text>
  <text x="960" y="410" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#e6edf3">Ozone IS life</text>
  <text x="960" y="490" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#6c7393">ozone is alive, in itself</text>
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Start with the strongest version. Reading one: ozone is itself alive. Not protective of</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">life — actually alive, in some real sense. This is the most poetic reading, and the most</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">easily testable. It comes apart almost immediately, but it deserves a careful answer</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">rather than scorn.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">सर्वात मजबूत आवृत्तीने सुरुवात करा. वाचन एक: ओझोन हे स्वतः जिवंत आहे. जीवनाचे</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">रक्षणकर्ते नाही — खरोखर जिवंत, काही खऱ्या अर्थाने. हे सर्वात काव्यमय वाचन आहे, आणि</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">सर्वात सहज तपासण्याजोगे. ते जवळजवळ लगेच कोलमडते, पण तिरस्काराऐवजी काळजीपूर्वक</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">उत्तर देण्यास पात्र आहे.</text>
</svg>