<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g10" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g10)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="3">what the shield stops</text>
  <g transform="translate(180,300)">
    <rect x="0" y="0" width="500" height="80" fill="#f85149"/>
    <text x="250" y="50" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#0b0e12" font-weight="bold">UV-C</text>
    <text x="250" y="-20" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="22" fill="#cdd6f4">100–280 nm</text>
    <text x="250" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="24" fill="#f38ba8">all blocked</text>

    <rect x="500" y="0" width="320" height="80" fill="#fab387"/>
    <text x="660" y="50" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#0b0e12" font-weight="bold">UV-B</text>
    <text x="660" y="-20" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="22" fill="#cdd6f4">280–315 nm</text>
    <text x="660" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="24" fill="#fab387">mostly blocked</text>

    <rect x="820" y="0" width="740" height="80" fill="#a6e3a1"/>
    <text x="1190" y="50" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#0b0e12" font-weight="bold">UV-A</text>
    <text x="1190" y="-20" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="22" fill="#cdd6f4">315–400 nm</text>
    <text x="1190" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="24" fill="#a6e3a1">passes through</text>
  </g>
  <text x="960" y="620" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#6c7393">source: NASA Ozone Watch · Earth Observatory</text>
  <rect x="0" y="633" width="1920" height="447" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="633" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Ultraviolet light comes in three flavours — A, B, and C. The high-energy C, the most</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">dangerous, is blocked almost completely. The middle B is mostly blocked. Only the gentler</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">A passes through to us. So the shielding is real. The number is real. The lab can</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">recompute it from the code that drew this very picture, and the answer comes back the same</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">to fifteen decimal places. The shield is supported by evidence — Class B in our ladder.</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">That much we keep.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">अतिनील किरण तीन प्रकारात येतात — A, B, आणि C. उच्च-ऊर्जा C, सर्वात धोकादायक,</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जवळजवळ पूर्णपणे अडवला जातो. मधला B बहुतेक अडवला जातो. फक्त सौम्य A आपल्यापर्यंत</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">पोहोचतो. म्हणून संरक्षण खरे आहे. आकडा खरा आहे. हीच चित्र काढणाऱ्या कोडवरून</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रयोगशाळा पुन्हा गणना करू शकते, आणि उत्तर पंधरा दशांश स्थानांपर्यंत तेच येते. कवच</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">पुराव्यांनी समर्थित आहे — आपल्या शिडीतील वर्ग B. एवढे आपण ठेवतो.</text>
</svg>