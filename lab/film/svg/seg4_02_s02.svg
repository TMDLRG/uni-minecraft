<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g1" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g1)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="180" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="4">CLAIM THREE — the breath of life</text>
  <rect x="360" y="260" width="1200" height="360" rx="18" fill="#1c2128" stroke="#cba6f7" stroke-width="3"/>
  <text x="960" y="350" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#e6edf3">"There is a single thread running</text>
  <text x="960" y="412" text-anchor="middle" font-family="Georgia,serif" font-size="48" fill="#e6edf3">through everything that lives:</text>
  <text x="960" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="56" fill="#cba6f7" font-weight="bold">a flow of electricity and breath."</text>
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Spoken aloud, the claim sounds like poetry. There is a single thread running through</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">everything that lives — a flow of electricity, of breath, of energy. Some traditions have</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">called it the breath. Some have called it the current. The bold scientific version of the</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">claim says all of those names point at the same real thing, and we can find it.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">उघडपणे बोलले तर, दावा कवितेसारखा वाटतो. प्रत्येक जिवंत गोष्टीतून एक एकच धागा वाहत</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आहे — विद्युत, श्वास, ऊर्जा यांचा प्रवाह. काही परंपरांनी त्याला श्वास म्हटले.</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">काहींनी प्रवाह म्हटले. या दाव्याची धाडसी वैज्ञानिक आवृत्ती म्हणते की ती सर्व नावे</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">एकाच खऱ्या गोष्टीकडे बोट दाखवतात, आणि आपण ती शोधू शकतो.</text>
</svg>