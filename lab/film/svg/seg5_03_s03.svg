<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g2" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g2)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="3">what survived — what we keep, with both hands</text>
  <g font-family="ui-sans-serif,'Segoe UI',sans-serif">
    <rect x="240" y="220" width="1440" height="80" rx="12" fill="#1c2128" stroke="#3b82f6" stroke-width="2"/>
    <text x="280" y="272" font-size="30" fill="#3b82f6" font-weight="bold">B</text>
    <text x="360" y="272" font-size="30" fill="#e6edf3">Ozone shields modern Earth's surface from lethal UV.</text>

    <rect x="240" y="320" width="1440" height="80" rx="12" fill="#1c2128" stroke="#3b82f6" stroke-width="2"/>
    <text x="280" y="372" font-size="30" fill="#3b82f6" font-weight="bold">B</text>
    <text x="360" y="372" font-size="30" fill="#e6edf3">Atmospheric pressure is real — 14.7 psi, isotropic.</text>

    <rect x="240" y="420" width="1440" height="80" rx="12" fill="#1c2128" stroke="#3b82f6" stroke-width="2"/>
    <text x="280" y="472" font-size="30" fill="#3b82f6" font-weight="bold">B</text>
    <text x="360" y="472" font-size="30" fill="#e6edf3">A single proton-gradient engine powers all known life.</text>

    <rect x="240" y="520" width="1440" height="80" rx="12" fill="#1c2128" stroke="#3b82f6" stroke-width="2"/>
    <text x="280" y="572" font-size="30" fill="#3b82f6" font-weight="bold">B</text>
    <text x="360" y="572" font-size="30" fill="#e6edf3">Oxygen makes that engine remarkably efficient.</text>
  </g>
  <rect x="0" y="565" width="1920" height="515" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="565" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="617" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Begin with what survived. Ozone really does shield modern Earth's surface from lethal</text>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">ultraviolet light. Atmospheric pressure really is a real, isotropic force, pressing on you</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">with about fourteen-point-seven pounds per square inch from every direction. A single</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">proton-gradient engine really does power every living cell we have ever looked inside of.</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And oxygen really does make that engine, for the creatures that can use it, remarkably</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">efficient. Four real facts about our world. Each one earned. Each one ours.</text>
  <rect x="800" y="801" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="841" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जे टिकले त्याने सुरुवात करा. ओझोन खरोखर आधुनिक पृथ्वीच्या पृष्ठभागाचे प्राणघातक</text>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">अतिनील प्रकाशापासून रक्षण करते. वातावरणीय दाब खरोखर एक खरा, सर्व दिशांनी कार्यरत</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">बल आहे, प्रत्येक दिशेने तुमच्यावर सुमारे साडे-चौदा पौंड प्रति चौरस इंच दाबणारा. एक</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रोटॉन-ग्रेडियंट इंजिन खरोखर आपण आत पाहिलेल्या प्रत्येक जिवंत पेशीला शक्ती देते.</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि ऑक्सिजन खरोखर ते इंजिन, ज्या जीवांना तो वापरता येतो त्यांच्यासाठी,</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">उल्लेखनीयपणे कार्यक्षम बनवते. आपल्या जगाबद्दल चार खरी तथ्ये. प्रत्येक मिळवलेले.</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रत्येक आपले.</text>
</svg>