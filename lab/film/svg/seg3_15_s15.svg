<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g14" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g14)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="380" text-anchor="middle" font-family="Georgia,serif" font-size="100" fill="#e6edf3" font-weight="bold">THE MOON</text>
  <rect x="660" y="420" width="600" height="3" fill="#cdd6f4" opacity="0.6"/>
  <text x="960" y="510" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" fill="#cdd6f4">no air. Still pulls.</text>
  <rect x="0" y="599" width="1920" height="481" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="599" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And then we come to the case that ends the conversation. On the Moon, with essentially</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">zero atmospheric pressure — no air, no breath, no sky — the pressure model is forced to</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">predict, by its own equation, a gravity of essentially zero. And the real answer? The</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Moon's gravity is one-point-six-two metres per second squared. Enough to drop a hammer and</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">a feather at the same speed in vacuum, which Apollo 15 astronauts did, on camera, for all</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">of us.</text>
  <rect x="800" y="835" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि मग आपण त्या प्रसंगाकडे येतो जो संभाषण संपवतो. चंद्रावर, अत्यंत शून्य वातावरणीय</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">दाबासह — हवा नाही, श्वास नाही, आकाश नाही — दाब मॉडेलला त्याच्या स्वतःच्या</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">समीकरणाने, अत्यंत शून्य गुरुत्वाकर्षण भाकीत करायला भाग पाडले जाते. आणि खरे उत्तर?</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">चंद्राचे गुरुत्वाकर्षण आहे एक-दशांश-सहा-दोन मीटर प्रति सेकंदाचा वर्ग.</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">व्हॅक्यूममध्ये हातोडा आणि पीस एकाच वेगाने टाकण्यासाठी पुरेसे, जे अपोलो १५</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">अंतराळवीरांनी, कॅमेऱ्यावर, आपल्या सर्वांसाठी केले.</text>
</svg>