<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g7" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g7)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="140" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="4">how much light gets through — the math</text>
  <text x="960" y="290" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="74" fill="#e6edf3">I = I₀ · e<tspan font-size="48" baseline-shift="super">−τ</tspan></text>
  <text x="960" y="380" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#9aa7b4">light through  =  light in  ×  e to the minus τ</text>
  <line x1="500" y1="430" x2="1420" y2="430" stroke="#30363d" stroke-width="2"/>
  <text x="960" y="500" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="42" fill="#cdd6f4">τ  =  σ · N</text>
  <text x="960" y="555" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#9aa7b4">optical depth  =  how much each molecule absorbs  ×  how many molecules are in the column</text>
  <text x="960" y="650" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="30" fill="#6c7393">Beer–Lambert · 19ᵗʰ century · still true</text>
  <rect x="0" y="701" width="1920" height="379" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="701" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">It says: light passing through an absorbing material falls off exponentially. The amount</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">that gets through is the amount that went in, multiplied by e — Euler's number — raised to</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">a negative power. That power is called the optical depth, written tau. The bigger tau</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">gets, the less light comes out the other side. It is a small equation, but it is the</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">entire bookkeeping of a shield.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तो म्हणतो: शोषक माध्यमातून जाणारा प्रकाश ऊर्जेयप्रमाणे कमी होतो. आत गेलेला प्रकाश,</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">e — ऑयलरचा अंक — च्या ऋण घातांकाने गुणला तर बाहेर येणारा प्रकाश मिळतो. त्या</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">घातांकाला प्रकाशीय खोली म्हणतात, टाऊ असे लिहितात. टाऊ जितका मोठा, दुसऱ्या बाजूने</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तितका कमी प्रकाश. लहान समीकरण, पण कवचाची संपूर्ण नोंद आहे.</text>
</svg>