  <text x="960" y="662" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#a6e3a1">max error ≤ 0.36% across all seven worlds.</text>
  <rect x="0" y="633" width="1920" height="447" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="633" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And here is what Newton's GM-over-R-squared predicts. Earth gravity? Nine-point-eight-two.</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Match. Moon? One-point-six-three. The real answer is one-point-six-two. A</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">four-tenths-of-one-percent error. Mars — match. Venus — match. Mercury — match. Jupiter,</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">off by less than one percent. Titan — match. Across all seven worlds, with no per-planet</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">tuning, the worst miss is one-point-zero percent and most of the others are essentially</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">exact.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि इथे आहे न्यूटनच्या GM/R² चे भाकीत. पृथ्वीचे गुरुत्वाकर्षण? नऊ-पूर्णांक-आठ-दोन.</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जुळते. चंद्र? एक-दशांश-सहा-तीन. खरे उत्तर एक-दशांश-सहा-दोन. चार-दशांश-एक-टक्का</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">त्रुटी. मंगळ — जुळते. शुक्र — जुळते. बुध — जुळते. गुरू, एक टक्क्यापेक्षा कमी</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">चुकतो. टायटन — जुळते. सर्व सात जगांवर, प्रत्येक ग्रहासाठी जुळवणीशिवाय, सर्वात वाईट</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">चूक एक-दशांश-शून्य टक्के आहे आणि बाकीच्या जवळजवळ अचूक आहेत.</text>
</svg>