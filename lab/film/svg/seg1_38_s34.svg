<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g37" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g37)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="150" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="4">three bold proposals</text>
  <g font-family="ui-sans-serif,sans-serif">
  <rect x="110" y="240" width="540" height="340" rx="14" fill="#1c2128" stroke="#89dceb" stroke-width="2"/><text x="380" y="320" text-anchor="middle" font-size="28" fill="#89dceb" letter-spacing="3">OZONE</text><text x="380" y="410" text-anchor="middle" font-size="32" fill="#e6edf3">the source of life?</text><text x="380" y="480" text-anchor="middle" font-size="22" fill="#6c7393">a shield — or something more</text>
  <rect x="690" y="240" width="540" height="340" rx="14" fill="#1c2128" stroke="#f9e2af" stroke-width="2"/><text x="960" y="320" text-anchor="middle" font-size="28" fill="#f9e2af" letter-spacing="3">PRESSURE</text><text x="960" y="410" text-anchor="middle" font-size="32" fill="#e6edf3">the source of weight?</text><text x="960" y="480" text-anchor="middle" font-size="22" fill="#6c7393">not mass, but the press of air</text>
  <rect x="1270" y="240" width="540" height="340" rx="14" fill="#1c2128" stroke="#a6e3a1" stroke-width="2"/><text x="1540" y="320" text-anchor="middle" font-size="28" fill="#a6e3a1" letter-spacing="3">PLANETS</text><text x="1540" y="410" text-anchor="middle" font-size="32" fill="#e6edf3">a great machine?</text><text x="1540" y="480" text-anchor="middle" font-size="22" fill="#6c7393">gears of solar engineering</text>
  </g>
  <rect x="0" y="770" width="1920" height="310" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="770" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="826" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">In the segments still ahead, we take these three claims and we put each of them, in turn,</text>
  <text x="960" y="865" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">to the fairest and hardest test we can build — the sky's shield, the weight of distant</text>
  <text x="960" y="904" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">worlds, and at the very end, the human meaning we were reaching for underneath all three.</text>
  <rect x="800" y="918" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="962" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">अजून पुढे असलेल्या भागांत, आपण हे तीन दावे घेतो आणि प्रत्येकाला, एकेक करून, आपण</text>
  <text x="960" y="1002" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">बांधू शकतो त्या सर्वात न्याय्य आणि कठीण चाचणीला लावतो — आकाशाचे कवच, दूरच्या</text>
  <text x="960" y="1042" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">जगांचे वजन, आणि अगदी शेवटी, या तिघांखाली आपण शोधत असलेला मानवी अर्थ.</text>
</svg>