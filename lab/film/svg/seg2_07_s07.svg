<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g6" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g6)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="90" letter-spacing="6" fill="#e6edf3" font-weight="bold">SECOND</text>
  <rect x="660" y="420" width="600" height="3" fill="#a6e3a1" opacity="0.55"/>
  <text x="960" y="500" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">the shield, in numbers</text>
  <rect x="0" y="770" width="1920" height="310" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="770" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="826" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">Now we measure the shielding. Not with poetry, but with arithmetic. We use a law that has</text>
  <text x="960" y="865" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">been in every physics textbook for a hundred and fifty years, and that absolutely nobody</text>
  <text x="960" y="904" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">disputes — the Beer–Lambert law.</text>
  <rect x="800" y="918" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="962" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">आता आपण कवचाचे मोजमाप करतो. कविता वापरून नाही, तर गणिताने. आपण असा एक नियम वापरतो</text>
  <text x="960" y="1002" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">जो दीडशे वर्षांपासून प्रत्येक भौतिकशास्त्र पाठ्यपुस्तकात आहे, आणि जो कोणालाही</text>
  <text x="960" y="1042" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">कधीही नाकारता आला नाही — बीयर–लॅम्बर्ट नियम.</text>
</svg>