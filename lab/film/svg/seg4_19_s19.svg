<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g18" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#13111c"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g18)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#cdd6f4" font-style="italic">"Class C — a structured hypothesis."</text>
  
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">We mark this as a Class C result — a structured hypothesis. The pattern is real, the data</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">is strong, the universality may yet be true. But the universe is large, and we have not</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">finished looking. We let the claim live in this narrowed form, where it can keep guiding</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">our search and our wonder, while it waits for the wider evidence to come in.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आपण याला वर्ग C परिणाम म्हणून खुणावतो — एक रचनात्मक गृहीतक. नमुना खरा आहे, माहिती</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">मजबूत आहे, सार्वत्रिकता अद्याप खरी असू शकते. पण विश्व मोठे आहे, आणि आपण पाहणे</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">संपवलेले नाही. आपण दाव्याला या संकुचित स्वरूपात जगू देतो, जिथे तो आपला शोध आणि</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आश्चर्य मार्गदर्शन करत राहू शकतो, व्यापक पुरावे येण्याची वाट पाहत.</text>
</svg>