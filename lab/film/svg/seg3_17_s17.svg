<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g16" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#13111c"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g16)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#cdd6f4" font-style="italic">"This is what a falsification looks like."</text>
  
  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Pause here for one moment. This is what a falsification looks like in real science. It is</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">not a clever argument. It is not someone shouting. It is just public numbers, fed through</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">a public equation, producing answers that no honest person can call correct. The</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">discipline is doing what the discipline does. The math has said no, in seven different</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">rooms, six different times.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">इथे क्षणभर थांबू. खऱ्या विज्ञानात खंडन असेच दिसते. ते हुशार युक्तिवाद नाही. ती</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">कोणीतरी ओरडणारी व्यक्ती नाही. ती फक्त सार्वजनिक आकडे आहेत, सार्वजनिक समीकरणातून</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">पाठवलेले, अशी उत्तरे निर्माण करत आहेत जी कोणीही प्रामाणिक व्यक्ती बरोबर म्हणू शकत</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">नाही. शिस्त जे करते ते करत आहे. गणिताने नाही म्हटले आहे, सात वेगवेगळ्या खोल्यांत,</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">सहा वेगवेगळ्या वेळा.</text>
</svg>