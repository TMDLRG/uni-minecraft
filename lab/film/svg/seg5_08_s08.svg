<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g7" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g7)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="140" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">the six honest labels — one final look</text>
    <rect x="200" y="202" width="68" height="60" rx="10" fill="#2ea043"/>
    <text x="234" y="237" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">A</text>
    <text x="300" y="237" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#cdd6f4">established / derivable</text>
    <text x="900" y="237" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#6c7393">the gravity equation, Beer–Lambert, the Nernst factor</text>
    <rect x="200" y="278" width="68" height="60" rx="10" fill="#3b82f6"/>
    <text x="234" y="313" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">B</text>
    <text x="300" y="313" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#cdd6f4">supported by mainstream evidence</text>
    <text x="900" y="313" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#6c7393">ozone shield, proton gradient, atmospheric pressure as a force</text>
    <rect x="200" y="354" width="68" height="60" rx="10" fill="#d29922"/>
    <text x="234" y="389" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">C</text>
    <text x="300" y="389" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#cdd6f4">structured hypothesis</text>
    <text x="900" y="389" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#6c7393">narrow biosignature inference; all-life-uses-a-gradient</text>
    <rect x="200" y="430" width="68" height="60" rx="10" fill="#a371f7"/>
    <text x="234" y="465" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">D</text>
    <text x="300" y="465" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#cdd6f4">interpretive synthesis</text>
    <text x="900" y="465" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#6c7393">the breath of life, the sacred current — preserved metaphor</text>
    <rect x="200" y="506" width="68" height="60" rx="10" fill="#8b949e"/>
    <text x="234" y="541" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">U</text>
    <text x="300" y="541" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#cdd6f4">speculative / unsupported</text>
    <text x="900" y="541" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#6c7393">none we claimed in this film</text>
    <rect x="200" y="582" width="68" height="60" rx="10" fill="#f85149"/>
    <text x="234" y="617" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">X</text>
    <text x="300" y="617" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#cdd6f4">contradicted by test</text>
    <text x="900" y="617" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#6c7393">ozone as life; pressure as weight; oxygen as required for all life</text>
  <rect x="0" y="633" width="1920" height="447" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="633" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Here are the six honest labels one more time. Notice — none of them is the word proven. We</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">did not use it once in five segments and we will not use it now. Because nothing this</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">large is ever proven, only supported by evidence, narrowed by hypothesis, preserved as</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">metaphor, or contradicted by test. That single missing word — proven — is the small, quiet</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">rebellion at the heart of this film. It is what makes everything else honest.</text>
  <rect x="800" y="835" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">इथे आहेत सहा प्रामाणिक खुणा एकदा पुन्हा. लक्षात घ्या — त्यापैकी कोणताही 'सिद्ध' हा</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">शब्द नाही. आपण पाच भागांत तो एकदाही वापरला नाही आणि आता वापरणार नाही. कारण एवढी</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">मोठी कोणतीही गोष्ट कधीही सिद्ध केली जात नाही, फक्त पुराव्यांनी समर्थित केली जाते,</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">गृहीतकाने संकुचित केली जाते, रूपक म्हणून जपली जाते, किंवा चाचणीत खोडली जाते. तो</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">एकच गहाळ शब्द — 'सिद्ध' — या चित्रपटाच्या केंद्रात एक छोटे, शांत बंड आहे. तेच बाकी</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">सर्व काही प्रामाणिक बनवते.</text>
</svg>