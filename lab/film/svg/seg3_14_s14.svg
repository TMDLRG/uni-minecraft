  <line x1="200" y1="570" x2="1720" y2="570" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="633" width="1920" height="447" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="633" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Here is what the challenger predicts. On Venus, with ninety-two bars of atmosphere, the</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">model predicts about eight hundred and ninety-one. The real answer is</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">eight-point-eight-seven. One hundred times too high. On Titan, with one-point-five bars,</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">the model predicts about fourteen. The real answer is one-point-three-five. Ten times too</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">high. On Mars, with its thin atmosphere, the model predicts almost nothing. Real Mars</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">gravity is three-point-seven. Sixty times too low.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">इथे आहे आव्हानवीराचे भाकीत. शुक्रावर, ब्याऐंशी बार वातावरणासह, मॉडेल सुमारे आठशे</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">एकाहत्तर भाकीत करते. खरे उत्तर आहे आठ-दशांश-आठ-सात. शंभर पट जास्त. टायटनवर,</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">एक-दशांश-पाच बार सह, मॉडेल सुमारे चौदा भाकीत करते. खरे उत्तर आहे एक-दशांश-तीन-पाच.</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">दहा पट जास्त. मंगळावर, पातळ वातावरणासह, मॉडेल जवळजवळ शून्य भाकीत करते. खरे मंगळाचे</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">गुरुत्वाकर्षण आहे तीन-दशांश-सात. साठ पट कमी.</text>
</svg>