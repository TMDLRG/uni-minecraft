    <text x="900" y="240" text-anchor="end" fill="#a6e3a1" font-size="26" font-family="ui-monospace,Consolas,monospace">9.82</text>
    <text x="1300" y="240" text-anchor="end" fill="#9aa7b4" font-size="26" font-family="ui-monospace,Consolas,monospace">9.82 (calibration)</text>
    <text x="1700" y="240" text-anchor="end" fill="#9aa7b4" font-size="22" font-family="ui-sans-serif,sans-serif">—</text>
    <text x="220" y="300" fill="#cdd6f4" font-size="26" font-family="ui-monospace,Consolas,monospace">Venus</text>
    <text x="560" y="300" text-anchor="end" fill="#cdd6f4" font-size="26" font-family="ui-monospace,Consolas,monospace">92 bar</text>
    <text x="900" y="300" text-anchor="end" fill="#a6e3a1" font-size="26" font-family="ui-monospace,Consolas,monospace">8.87</text>
    <text x="1300" y="300" text-anchor="end" fill="#f85149" font-size="26" font-family="ui-monospace,Consolas,monospace">≈ 891</text>
    <text x="1700" y="300" text-anchor="end" fill="#f85149" font-size="22" font-family="ui-sans-serif,sans-serif">100× too HIGH</text>
    <text x="220" y="360" fill="#cdd6f4" font-size="26" font-family="ui-monospace,Consolas,monospace">Titan</text>
    <text x="560" y="360" text-anchor="end" fill="#cdd6f4" font-size="26" font-family="ui-monospace,Consolas,monospace">1.467 bar</text>
    <text x="900" y="360" text-anchor="end" fill="#a6e3a1" font-size="26" font-family="ui-monospace,Consolas,monospace">1.354</text>
    <text x="1300" y="360" text-anchor="end" fill="#f85149" font-size="26" font-family="ui-monospace,Consolas,monospace">≈ 14.2</text>
    <text x="1700" y="360" text-anchor="end" fill="#f85149" font-size="22" font-family="ui-sans-serif,sans-serif">10.5× too HIGH</text>
