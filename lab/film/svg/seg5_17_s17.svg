  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And now we walk on. We did not solve the universe in five segments. We did not promise we</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">would. We honored some hopeful ideas, we listened to what the world said back, and we</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">wrote down — exactly, with care, in plain English and plain Marathi — what survived and</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">what did not. That is a small thing. It is also, I think, the only thing that has ever</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">moved a species from where it is to where it might be.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि आता आपण पुढे चालतो. आपण पाच भागांत विश्वाची सोडवणूक केली नाही. आपण तसे वचन</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">दिले नव्हते. आपण काही आशादायक कल्पनांचा सन्मान केला, जगाने काय परत सांगितले ते आपण</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ऐकले, आणि आपण लिहिले — नेमके, काळजीपूर्वक, साध्या इंग्रजीत आणि साध्या मराठीत — काय</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">टिकले आणि काय टिकले नाही. ती छोटी गोष्ट आहे. ती, मला वाटते, अशी एकमेव गोष्ट आहे</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जिने कधीही एका प्रजातीला ती जिथे आहे तिथून ती जिथे असू शकते तिथे हलवले आहे.</text>
</svg>