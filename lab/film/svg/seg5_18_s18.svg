<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g17" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g17)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <g transform="translate(960,360)" opacity="0.85">
    <circle r="20" fill="#f9e2af"/>
    <circle r="60" fill="none" stroke="#f9e2af" stroke-width="1.5" opacity="0.4"/>
    <circle r="110" fill="none" stroke="#f9e2af" stroke-width="1" opacity="0.25"/>
    <circle r="180" fill="none" stroke="#f9e2af" stroke-width="1" opacity="0.15"/>
  </g>
  <rect x="0" y="565" width="1920" height="515" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="565" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="617" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And so we wish you, sincerely, a slightly safer world tomorrow than the one you went to</text>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">bed in tonight. We wish you patient ears for ideas you disagree with. We wish you courage</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">for ideas you hope are true. We wish you the practice of stating your bar before your run.</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">We wish you the freedom of letting go of a wrong belief without the burden of shame. And</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">we wish you, above all, the company of other travelers who are walking, with you, the same</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">gentle, stubborn road.</text>
  <rect x="800" y="801" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="841" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि म्हणून आम्ही तुम्हाला, मनापासून, आज रात्री ज्यात तुम्ही झोपलात त्यापेक्षा</text>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">उद्या किंचित सुरक्षित जग शुभेच्छा. आम्ही तुम्हाला असहमत असलेल्या कल्पनांसाठी</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">धैर्यवान कान शुभेच्छा. आम्ही तुम्हाला खऱ्या असाव्यात अशी आशा असलेल्या कल्पनांसाठी</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">धैर्य शुभेच्छा. आम्ही तुम्हाला चाचणीआधी रेषा सांगण्याची प्रथा शुभेच्छा. आम्ही</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तुम्हाला लाजेच्या ओझ्याशिवाय चुकीची समजूत सोडण्याचे स्वातंत्र्य शुभेच्छा. आणि</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आम्ही तुम्हाला, सर्वांत वर, त्याच सौम्य, हट्टी रस्त्यावर तुमच्यासोबत चालणाऱ्या इतर</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रवाशांची सोबत शुभेच्छा.</text>
</svg>