<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g9" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g9)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="120" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">a single common ancestor — and the gradient was already there</text>
  <g transform="translate(960,380)" stroke="#cdd6f4" stroke-width="2" fill="none">
    <line x1="0" y1="0" x2="0" y2="-100"/>
    <line x1="0" y1="-100" x2="-300" y2="-200"/>
    <line x1="0" y1="-100" x2="0" y2="-200"/>
    <line x1="0" y1="-100" x2="300" y2="-200"/>
    <circle cx="0" cy="0" r="50" fill="#1c2128" stroke="#f9e2af" stroke-width="3"/>
  </g>
  <text x="960" y="395" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#f9e2af" font-weight="bold">LUCA</text>
  <text x="660" y="195" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#a6e3a1">Bacteria</text>
  <text x="960" y="195" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#89dceb">Archaea</text>
  <text x="1260" y="195" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#cba6f7">Eukarya — us</text>
  <text x="960" y="610" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#cdd6f4" font-style="italic">"Every living thing carries the same engine."</text>
  <rect x="0" y="599" width="1920" height="481" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="599" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And here is the truly astonishing part. Every cell ever studied — bacteria, archaea,</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">plants, fungi, you — uses some version of this same proton-gradient machinery.</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Three-and-a-half billion years ago, the very first common ancestor of every living thing</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">on this planet — biologists call it LUCA — almost certainly was already making ATP this</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">way. The mechanism is older than animals. Older than plants. Older than oxygen. It is, in</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">the deepest possible sense, what life is.</text>
  <rect x="800" y="835" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि इथे आहे खरोखर चकित करणारा भाग. आत्तापर्यंत अभ्यासलेली प्रत्येक पेशी — जीवाणू,</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आर्किया, वनस्पती, बुरशी, तुम्ही — याच प्रोटॉन-ग्रेडियंट यंत्रणेची काही ना काही</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आवृत्ती वापरते. साडे-तीन अब्ज वर्षांपूर्वी, या ग्रहावरील प्रत्येक जिवंत गोष्टीचा</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">सर्वात पहिला सामायिक पूर्वज — जीवशास्त्रज्ञ त्याला LUCA म्हणतात — जवळजवळ निश्चितच</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आधीच अशा प्रकारे ATP बनवत होता. यंत्रणा प्राण्यांपेक्षा जुनी आहे. वनस्पतींपेक्षा</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">जुनी. ऑक्सिजनपेक्षा जुनी. ती, सर्वात खोल अर्थाने, जीवन काय आहे ते आहे.</text>
</svg>