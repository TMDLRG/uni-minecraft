<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g24" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#0f1320"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g24)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <line x1="260" y1="300" x2="1660" y2="300" stroke="#30363d" stroke-width="3"/>
  <circle cx="500" cy="300" r="10" fill="#f38ba8"/>
  <text x="500" y="250" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="30" fill="#f38ba8">1690 – 1908</text>
  <text x="960" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#e6edf3" font-weight="bold">A bold idea that did not survive</text>
  <text x="960" y="520" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#9aa7b4">Le Sage's push-gravity: tested, and set aside.</text>
  <rect x="0" y="633" width="1920" height="447" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="633" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Now the other half of the honest record — because it would be a cheat to show you only the</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">idea that won. Centuries ago, thinkers named Fatio and Le Sage proposed a beautiful answer</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">to gravity itself. What if gravity is not a pull but a push? What if space is full of tiny</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">particles streaming in every direction, and two objects simply shadow each other from that</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">storm, and get shoved together? It was bold. And, crucially, it was genuinely testable.</text>
  <rect x="800" y="835" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आता प्रामाणिक नोंदीचा दुसरा भाग — कारण फक्त जिंकलेली कल्पना दाखवणे ही फसवणूक ठरेल.</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">शतकांपूर्वी, फॅटिओ आणि ल साज नावाच्या विचारवंतांनी गुरुत्वाकर्षणालाच एक सुंदर</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">उत्तर दिले. गुरुत्वाकर्षण ओढ नसून धक्का असेल तर? अवकाश सर्व दिशांनी वाहणाऱ्या</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">सूक्ष्म कणांनी भरलेले असेल, आणि दोन वस्तू एकमेकांना त्या वादळापासून सावली देऊन</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">एकत्र ढकलल्या जात असतील तर? ते धाडसी होते. आणि, महत्त्वाचे म्हणजे, ते खरोखर</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तपासण्याजोगे होते.</text>
</svg>