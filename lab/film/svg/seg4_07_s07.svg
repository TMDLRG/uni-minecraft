<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g6" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g6)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="120" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">a membrane — and a proton gradient across it</text>
  <!-- membrane band -->
  <rect x="160" y="280" width="1600" height="14" fill="#3b3450"/>
  <rect x="160" y="460" width="1600" height="14" fill="#3b3450"/>
  <text x="120" y="290" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="22" fill="#6c7393">outside</text>
  <text x="120" y="470" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="22" fill="#6c7393">inside</text>
  <!-- protons above (many) -->
  <g fill="#f9e2af">
    <circle cx="260" cy="220" r="9"/><circle cx="340" cy="190" r="9"/><circle cx="430" cy="230" r="9"/><circle cx="540" cy="200" r="9"/>
    <circle cx="640" cy="220" r="9"/><circle cx="720" cy="180" r="9"/><circle cx="820" cy="240" r="9"/><circle cx="900" cy="200" r="9"/>
    <circle cx="1000" cy="190" r="9"/><circle cx="1100" cy="220" r="9"/><circle cx="1180" cy="200" r="9"/><circle cx="1280" cy="240" r="9"/>
    <circle cx="1380" cy="190" r="9"/><circle cx="1480" cy="210" r="9"/><circle cx="1580" cy="180" r="9"/><circle cx="1660" cy="230" r="9"/>
  </g>
  <!-- few inside -->
  <g fill="#f9e2af" opacity="0.7">
    <circle cx="400" cy="540" r="9"/><circle cx="900" cy="560" r="9"/><circle cx="1380" cy="540" r="9"/>
  </g>
  <!-- ATP synthase symbol -->
  <g transform="translate(960,367)">
    <rect x="-40" y="-93" width="80" height="186" rx="14" fill="#1c2128" stroke="#a6e3a1" stroke-width="3"/>
    <circle cx="0" cy="0" r="34" fill="#1c2128" stroke="#a6e3a1" stroke-width="3"/>
    <text x="0" y="9" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#a6e3a1" font-weight="bold">ATP</text>
  </g>
  <!-- arrow downward through synthase -->
  <line x1="960" y1="260" x2="960" y2="285" stroke="#f9e2af" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="960" y1="470" x2="960" y2="495" stroke="#f9e2af" stroke-width="4" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f9e2af"/></marker></defs>
  <text x="960" y="610" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#cdd6f4" font-style="italic">protons flow downhill — the cell makes ATP</text>
  <rect x="0" y="633" width="1920" height="447" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="633" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Picture a tiny membrane inside one of your cells. On one side of it, your cell pumps</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">protons — hydrogen ions, the smallest positive particles in chemistry — until there are</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">many more on one side than the other. That difference, that lopsidedness, stores energy,</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">the way water stored behind a dam stores energy. Then the cell lets the protons flow back,</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">through a tiny molecular turbine, and the turbine spins and stitches ATP together. A</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">microscopic hydroelectric dam.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तुमच्या एका पेशीच्या आत एक लहान पडदा कल्पना. त्याच्या एका बाजूला, तुमची पेशी</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रोटॉन उपसते — हायड्रोजन आयन, रसायनशास्त्रातील सर्वात लहान धन कण — एका बाजूला</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">दुसऱ्यापेक्षा खूप जास्त होईपर्यंत. तो फरक, ती असमतोलता, ऊर्जा साठवते, धरणामागे</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">साठलेले पाणी ऊर्जा साठवते तसे. मग पेशी प्रोटॉनना परत वाहू देते, एका लहान आण्विक</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">टर्बाइनमधून, आणि टर्बाइन फिरते आणि ATP जोडते. एक सूक्ष्म जलविद्युत धरण.</text>
</svg>