  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Here, in one place, is the full ledger. Twelve readings of three claims. Four reading the</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">green-blue colour of supported within model. Three reading the red of contradicted by</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">test. Two reading the gentle gold of narrowed hypothesis. And three reading the violet of</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">metaphor preserved. No reading was promoted by certainty. No reading was demoted by scorn.</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Each one is here because the math said it could be here, exactly here, and nowhere else.</text>
  <rect x="800" y="835" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">इथे, एका ठिकाणी, संपूर्ण खातावही आहे. तीन दाव्यांची बारा वाचने. चार 'मॉडेलमध्ये</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">समर्थित' च्या हिरव्या-निळ्या रंगाची. तीन 'चाचणीत खोडलेली' च्या लाल रंगाची. दोन</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">'संकुचित गृहीतक' च्या सौम्य सोनेरी रंगाची. आणि तीन 'रूपक जपलेले' च्या जांभळ्या</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">रंगाची. कोणतेही वाचन निश्चिततेमुळे बढती मिळाली नाही. कोणतेही वाचन तिरस्कारामुळे</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">खाली आणले गेले नाही. प्रत्येक इथे आहे कारण गणिताने सांगितले की ते इथे, नेमके इथे,</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">असू शकते, आणि इतरत्र कुठेही नाही.</text>
</svg>