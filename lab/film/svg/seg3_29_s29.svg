<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g28" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g28)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="90" letter-spacing="6" fill="#e6edf3" font-weight="bold">THE DREAM</text>
  <rect x="660" y="420" width="600" height="3" fill="#f9e2af" opacity="0.55"/>
  <text x="960" y="500" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">honored, even here</text>
  <rect x="0" y="770" width="1920" height="310" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="770" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="826" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">And here, as in the last segment, I want to take a quiet moment to honor the person who</text>
  <text x="960" y="865" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">reached for this idea. Because I think the reaching itself was the right kind of bravery,</text>
  <text x="960" y="904" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">even if the destination turned out to be in a different room.</text>
  <rect x="800" y="918" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="962" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">आणि इथे, मागील भागाप्रमाणे, मला या कल्पनेकडे पोहोचणाऱ्या व्यक्तीचा सन्मान</text>
  <text x="960" y="1002" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">करण्यासाठी एक शांत क्षण घ्यायचा आहे. कारण मला वाटते की पोहोचणे हीच योग्य प्रकारची</text>
  <text x="960" y="1042" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">शूरता होती, गंतव्यस्थान वेगळ्या खोलीत निघाले तरीही.</text>
</svg>