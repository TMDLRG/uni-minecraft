<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g17" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g17)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <rect x="510" y="220" width="900" height="360" rx="18" fill="#1c2128" stroke="#a6e3a1" stroke-width="3"/>
  <text x="960" y="310" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" fill="#a6e3a1" letter-spacing="6">CLAIM THREE</text>
  <text x="960" y="410" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#e6edf3">A great machine</text>
  <text x="960" y="490" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#6c7393">the solar system as engineering</text>
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And the third claim is the grandest of all. Look up at the planets, wheeling in their</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">orbits century after century, never colliding, never wandering off. The proposal is that</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">this is no accident of gravity and dust — that the Sun and its planets are a precise</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">machine, an engine and its meshing gears, turning in deliberate, designed order.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि तिसरा दावा सर्वांत भव्य आहे. ग्रहांकडे पाहा, शतकानुशतके आपल्या कक्षांत</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">फिरणारे, कधीही न आदळणारे, कधीही भरकटून न जाणारे. प्रस्ताव असा की हा गुरुत्वाकर्षण</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि धुळीचा योगायोग नाही — की सूर्य आणि त्याचे ग्रह म्हणजे एक अचूक यंत्र आहे, एक</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">इंजिन आणि त्याचे एकमेकांत गुंतलेले गिअर्स, ठरवून, रचून क्रमाने फिरणारे.</text>
</svg>