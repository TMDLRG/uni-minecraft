<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g35" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g35)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
<text x="960" y="276" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">An honest 'no'</text>
<text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#9aa7b4" font-weight="normal">is a real result —</text>
<text x="960" y="444" text-anchor="middle" font-family="Georgia,serif" font-size="60" fill="#a6e3a1" font-weight="bold">not a failure.</text>
  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And last, the gentlest rule of all, the one that makes all the others survivable. When a</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">test comes back negative — when the idea we hoped for does not hold — that is not a</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">failure of the work. A clear, honest no is itself a real result. It is knowledge. It tells</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">us, truthfully, where not to look, so the next traveler does not lose the same years we</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">did.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि शेवटी, सर्वांत सौम्य नियम, जो बाकी सर्व सहन करण्याजोगे करतो. जेव्हा चाचणी</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">नकारात्मक येते — जेव्हा आपण आशा केलेली कल्पना टिकत नाही — तो कामाचा पराभव नाही.</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">स्पष्ट, प्रामाणिक 'नाही' हाच एक खरा निष्कर्ष आहे. ते ज्ञान आहे. ते आपल्याला</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">खरेपणाने सांगते की कुठे पाहू नये, म्हणजे पुढचा प्रवासी आपण गमावलेली तीच वर्षे</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">गमावणार नाही.</text>
</svg>