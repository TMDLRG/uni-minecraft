<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g22" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#0f1320"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g22)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <line x1="260" y1="300" x2="1660" y2="300" stroke="#30363d" stroke-width="3"/>
  <circle cx="500" cy="300" r="10" fill="#a6e3a1"/>
  <text x="500" y="250" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="30" fill="#a6e3a1">1950s–60s</text>
  <text x="960" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="52" fill="#e6edf3" font-weight="bold">The evidence finally arrived</text>
  <text x="960" y="520" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="30" fill="#9aa7b4">Seafloor spreading, magnetic stripes — a mechanism.</text>
  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Wegener died on the ice in Greenland, still mocked, never vindicated in his lifetime. And</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">then, decades after his death, the missing piece arrived. New instruments mapped the floor</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">of the oceans and found it spreading apart, with the rock recording the Earth's flipping</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">magnetic field in frozen stripes. There, at last, was the mechanism. His absurd idea</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">became plate tectonics — the bedrock of all modern geology.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">वेगेनर ग्रीनलंडच्या बर्फावर मरण पावला, अजूनही उपहासित, हयातीत कधीही निर्दोष ठरला</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">नाही. आणि मग, त्याच्या मृत्यूनंतर दशकांनी, हरवलेला तुकडा आला. नव्या उपकरणांनी</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">महासागरांचा तळ नकाशात आणला आणि तो विलग होत असल्याचे आढळले, खडकाने पृथ्वीचे उलटणारे</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">चुंबकीय क्षेत्र गोठलेल्या पट्ट्यांत नोंदवले होते. तिथे, अखेर, यंत्रणा होती. त्याची</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">हास्यास्पद कल्पना भूपट्ट सिद्धांत बनली — सर्व आधुनिक भूगर्भशास्त्राचा पाया.</text>
</svg>