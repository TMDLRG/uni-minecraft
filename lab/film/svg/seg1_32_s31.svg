<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g31" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g31)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <g transform="translate(960,380)" stroke="#cdd6f4" stroke-width="3" fill="none"><line x1="0" y1="-150" x2="0" y2="150"/><line x1="-230" y1="-96" x2="230" y2="-96"/><line x1="-230" y1="-96" x2="-230" y2="-40"/><line x1="230" y1="-96" x2="230" y2="-40"/><ellipse cx="-230" cy="-30" rx="96" ry="18" fill="#1c2128" stroke="#89b4fa"/><ellipse cx="230" cy="-30" rx="96" ry="18" fill="#1c2128" stroke="#a6e3a1"/><line x1="-76" y1="150" x2="76" y2="150"/></g>
  <text x="730" y="365" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#89b4fa">the dream</text>
  <text x="1190" y="365" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#a6e3a1">the test</text>
  <rect x="0" y="701" width="1920" height="379" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="701" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And fourth, holding all the others together: we keep the dream and the test in balance. We</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">owe a real idea a real test — one generous enough to actually let it win if it deserves</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">to, and strict enough that, when it does win, the winning genuinely means something. Too</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">soft, and we fool ourselves. Too cruel, and we lose the truth the idea was reaching for.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि चौथे, बाकी सर्वांना एकत्र धरून ठेवणारे: आपण स्वप्न आणि चाचणी समतोलात ठेवतो.</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">खऱ्या कल्पनेला आपण खरी चाचणी देणे लागतो — पात्र असेल तर तिला खरोखर जिंकू</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">देण्याइतकी उदार, आणि ती जिंकली तर त्या जिंकण्याला खरोखर अर्थ असेल इतकी कठोर. फार</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">मऊ असली तर आपण स्वतःला फसवतो. फार क्रूर असली तर कल्पना ज्या सत्याकडे पोहोचत होती</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ते आपण गमावतो.</text>
</svg>