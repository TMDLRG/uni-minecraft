  <text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="96" letter-spacing="6" fill="#e6edf3" font-weight="bold">ACT ONE</text>
  <rect x="660" y="420" width="600" height="3" fill="#f9e2af" opacity="0.55"/>
  <text x="960" y="500" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">The Traveler</text>
  <rect x="0" y="825" width="1920" height="255" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="825" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="887" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="38" fill="#e6edf3">It begins, as these things so often do, with a single curious person, and a question too</text>
  <text x="960" y="933" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="38" fill="#e6edf3">big to put down.</text>
  <rect x="800" y="947" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="995" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="34" fill="#cdd6f4">हे सुरू होते, जसे अनेकदा होते, एका जिज्ञासू व्यक्तीने, आणि खाली ठेवता न येणाऱ्या</text>
  <text x="960" y="1040" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="34" fill="#cdd6f4">एका मोठ्या प्रश्नाने.</text>
