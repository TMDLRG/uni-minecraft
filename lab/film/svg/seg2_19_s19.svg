<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g18" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#1a1422"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g18)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="3">Earth's own deep past says no</text>
  <g transform="translate(160,300)">
    <line x1="0" y1="120" x2="1600" y2="120" stroke="#30363d" stroke-width="4"/>

    <circle cx="0" cy="120" r="14" fill="#f9e2af"/>
    <text x="0" y="80" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#f9e2af">4.5 Ga</text>
    <text x="0" y="180" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#9aa7b4">Earth forms</text>

    <circle cx="500" cy="120" r="14" fill="#a6e3a1"/>
    <text x="500" y="80" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#a6e3a1">~3.7 Ga</text>
    <text x="500" y="180" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#cdd6f4">first life — anoxic</text>

    <circle cx="1100" cy="120" r="14" fill="#89dceb"/>
    <text x="1100" y="80" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#89dceb">~2.4 Ga</text>
    <text x="1100" y="180" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="22" fill="#cdd6f4">Great Oxidation Event</text>

    <circle cx="1600" cy="120" r="14" fill="#fab387"/>
    <text x="1600" y="80" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#fab387">today</text>
  </g>
  <text x="960" y="600" text-anchor="middle" font-family="Georgia,serif" font-size="36" fill="#cdd6f4" font-style="italic">"Life beat the ozone layer by more than a billion years."</text>
  <rect x="0" y="633" width="1920" height="447" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="633" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Earth is about four-and-a-half billion years old. The first signs of life appear in rocks</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">that are around three-and-a-half billion years old. The atmosphere did not become</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">substantially oxygen-rich until something called the Great Oxidation Event, roughly</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">two-point-four billion years ago. So life had already been thriving on this planet for</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">more than a billion years before there was enough oxygen for ozone to form a real shield.</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Life beat the ozone layer by a billion years.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">पृथ्वी सुमारे साडे-चार अब्ज वर्षे जुनी आहे. जीवनाच्या पहिल्या खुणा साडे-तीन अब्ज</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">वर्षे जुन्या खडकांत दिसतात. वातावरण मोठ्या ऑक्सिडेशन घटनेपर्यंत मोठ्या प्रमाणावर</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ऑक्सिजनयुक्त झाले नव्हते, साधारण २.४ अब्ज वर्षांपूर्वी. म्हणून ओझोन खरे कवच</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">बनवण्यासाठी पुरेसा ऑक्सिजन येण्याच्या अब्ज वर्षांपूर्वीच जीवन या ग्रहावर भरभराटीत</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">होते. जीवनाने ओझोन थराला एक अब्ज वर्षांनी हरवले.</text>
</svg>