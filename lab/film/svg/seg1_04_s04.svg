<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g3" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g3)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <g transform="translate(960,360)"><circle r="160" fill="none" stroke="#89b4fa" stroke-width="3" opacity="0.7"/><circle r="100" fill="none" stroke="#89b4fa" stroke-width="2" opacity="0.35"/><circle r="40" fill="#cdd6f4" opacity="0.18"/><g stroke="#f9e2af" stroke-width="2" opacity="0.6"><line x1="-380" y1="-180" x2="-160" y2="-70"/><line x1="-160" y1="-70" x2="380" y2="110"/><line x1="-380" y1="0" x2="-160" y2="20"/><line x1="-160" y1="20" x2="380" y2="0"/><line x1="-380" y1="180" x2="-160" y2="120"/><line x1="-160" y1="120" x2="380" y2="-70"/></g></g>
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">All of it — the love and the fear alike — settles into us as priors. A prior is just a</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">quiet expectation: the lens we look through before we have looked at all. It bends the</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">incoming light. And a prior is not a flaw. It is how a mind survives a world it cannot</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">fully see.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ते सर्व — प्रेम आणि भीती दोन्ही — आपल्यात पूर्वग्रह म्हणून रुजतात. पूर्वग्रह</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">म्हणजे फक्त एक शांत अपेक्षा: पाहण्याआधीच आपण ज्यातून पाहतो ती भिंग. ते येणारा</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रकाश वाकवते. आणि पूर्वग्रह म्हणजे दोष नाही. पूर्ण न दिसणाऱ्या जगात मन कसे टिकते</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">याचे ते स्वरूप आहे.</text>
</svg>