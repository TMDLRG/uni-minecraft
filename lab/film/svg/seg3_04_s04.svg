<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g3" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g3)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="160" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="3">Newton's law of surface gravity</text>
  <text x="960" y="380" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="120" fill="#e6edf3">g  =  GM / R²</text>
  <text x="960" y="490" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#9aa7b4">gravity at the surface = a constant × the body's mass ÷ its radius squared</text>
  <line x1="500" y1="540" x2="1420" y2="540" stroke="#30363d" stroke-width="2"/>
  <text x="960" y="610" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="28" fill="#cdd6f4">G = 6.674 × 10⁻¹¹  m³ kg⁻¹ s⁻²  (CODATA)</text>
  <text x="960" y="670" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="26" fill="#6c7393">No air, no pressure, no atmosphere — only mass and radius.</text>
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Here is Newton's claim, in a single line. Surface gravity equals a universal constant — G</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">— multiplied by the body's mass, divided by its radius squared. Nothing about air. Nothing</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">about pressure. Nothing about what gases happen to be hanging above the surface. Only mass</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">and radius. That is the whole story.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">इथे आहे न्यूटनचा दावा, एका ओळीत. पृष्ठभागावरील गुरुत्वाकर्षण म्हणजे एक सार्वत्रिक</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">स्थिरांक — G — गुणिले शरीराचे वस्तुमान, भागिले त्रिज्येचा वर्ग. हवेबद्दल काहीही</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">नाही. दाबाबद्दल काहीही नाही. पृष्ठभागावर कोणते वायू असतात याबद्दल काहीही नाही.</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">फक्त वस्तुमान आणि त्रिज्या. हीच सर्व कहाणी आहे.</text>
</svg>