<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g17" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g17)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="88" letter-spacing="6" fill="#e6edf3" font-weight="bold">READING D</text>
  <rect x="660" y="420" width="600" height="3" fill="#d29922" opacity="0.55"/>
  <text x="960" y="500" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">every life uses a gradient?</text>
  <rect x="0" y="531" width="1920" height="549" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="531" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="583" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Then there is reading D, the deepest and trickiest reading of the third claim. It says</text>
  <text x="960" y="617" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">every form of life everywhere uses a proton gradient. Every. Form. Everywhere. And here</text>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">the answer is more humble than the question. We can only honestly speak about the forms of</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">life we have looked at — which is the life on this one small planet. About life elsewhere</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">in the universe, we know nothing yet. So we narrow the claim. The claim becomes: every</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">form of life on Earth that we have examined uses some version of a proton gradient — and</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">in that careful, narrowed form, the answer holds.</text>
  <rect x="800" y="801" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="841" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">मग वाचन D आहे, तिसऱ्या दाव्याचे सर्वात खोल आणि सर्वात अवघड वाचन. ते म्हणते सर्वत्र</text>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">प्रत्येक जीवनाचा प्रकार प्रोटॉन ग्रेडियंट वापरतो. प्रत्येक. प्रकार. सर्वत्र. आणि</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">इथे उत्तर प्रश्नापेक्षा अधिक नम्र आहे. आपण फक्त ज्या जीवनाच्या प्रकारांकडे पाहिले</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आहे त्याबद्दलच प्रामाणिकपणे बोलू शकतो — जे या एका लहान ग्रहावरील जीवन आहे. विश्वात</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">इतरत्र जीवनाबद्दल, आम्हाला अद्याप काहीही माहीत नाही. म्हणून आपण दावा संकुचित करतो.</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">दावा बनतो: पृथ्वीवरील आपण तपासलेले जीवनाचे प्रत्येक रूप प्रोटॉन ग्रेडियंटची काही</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ना काही आवृत्ती वापरते — आणि त्या काळजीपूर्वक, संकुचित स्वरूपात, उत्तर टिकते.</text>
</svg>