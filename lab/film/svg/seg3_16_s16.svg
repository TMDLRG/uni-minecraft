<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g15" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g15)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="130" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">the size of the failure</text>

  <text x="320" y="280" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#cdd6f4">Venus       — too HIGH by</text>
  <rect x="800" y="248" width="200" height="42" fill="#f85149"/><text x="900" y="280" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="28" fill="#fff">100×</text>

  <text x="320" y="370" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#cdd6f4">Titan       — too HIGH by</text>
  <rect x="800" y="338" width="60" height="42" fill="#f85149"/><text x="900" y="370" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="28" fill="#fff">10×</text>

  <text x="320" y="460" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#cdd6f4">Mars        — too LOW by</text>
  <rect x="800" y="428" width="120" height="42" fill="#f85149"/><text x="900" y="460" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="28" fill="#fff">60×</text>

  <text x="320" y="550" font-family="ui-sans-serif,sans-serif" font-size="28" fill="#cdd6f4">Moon &amp; Mercury — too LOW by</text>
  <rect x="800" y="518" width="800" height="42" fill="#f85149"/><text x="1200" y="550" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="32" fill="#fff" font-weight="bold">~10¹⁴×</text>

  <text x="960" y="660" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#f9e2af" font-style="italic">A factor of ten trillion is not a rounding error.</text>
  <rect x="0" y="701" width="1920" height="379" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="701" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Look at the size of the failure. Not a sloppy fit. Not a slightly miscalibrated graph. The</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">pressure model is off by a factor of one hundred on Venus, ten on Titan, sixty on Mars,</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">and on the Moon and Mercury it is off by something like ten trillion. A factor of ten</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">trillion is not a rounding error. It is not a near miss. It is two different worlds,</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">sitting in two different rooms.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">अपयशाचा आकार पहा. ढिल्ले जुळवण नाही. किंचित चुकीचे कॅलिब्रेट केलेले आलेख नाही. दाब</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">मॉडेल शुक्रावर शंभर, टायटनवर दहा, मंगळावर साठ पटीने चुकते, आणि चंद्र व बुधावर ते</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">दहा-कोटी-कोटीच्या क्रमाने चुकते. दहा-कोटी-कोटीचा घटक म्हणजे गोलाकार त्रुटी नाही.</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">तो जवळचा चुक नाही. ती दोन वेगवेगळी जगे आहेत, दोन वेगवेगळ्या खोल्यांत बसलेली.</text>
</svg>