<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g28" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g28)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g><text x="960" y="140" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="3">how sure are we? — one honest label per claim</text>
<g transform="translate(560,200)"><rect x="0" y="0" width="64" height="64" rx="10" fill="#2ea043"/><text x="32" y="44" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">A</text><text x="100" y="44" font-family="ui-sans-serif,sans-serif" font-size="34" fill="#cdd6f4">established / derivable</text></g>
<g transform="translate(560,278)"><rect x="0" y="0" width="64" height="64" rx="10" fill="#3b82f6"/><text x="32" y="44" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">B</text><text x="100" y="44" font-family="ui-sans-serif,sans-serif" font-size="34" fill="#cdd6f4">mainstream evidence</text></g>
<g transform="translate(560,356)"><rect x="0" y="0" width="64" height="64" rx="10" fill="#d29922"/><text x="32" y="44" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">C</text><text x="100" y="44" font-family="ui-sans-serif,sans-serif" font-size="34" fill="#cdd6f4">structured hypothesis</text></g>
<g transform="translate(560,434)"><rect x="0" y="0" width="64" height="64" rx="10" fill="#a371f7"/><text x="32" y="44" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">D</text><text x="100" y="44" font-family="ui-sans-serif,sans-serif" font-size="34" fill="#cdd6f4">interpretation</text></g>
<g transform="translate(560,512)"><rect x="0" y="0" width="64" height="64" rx="10" fill="#8b949e"/><text x="32" y="44" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">U</text><text x="100" y="44" font-family="ui-sans-serif,sans-serif" font-size="34" fill="#cdd6f4">speculative</text></g>
<g transform="translate(560,590)"><rect x="0" y="0" width="64" height="64" rx="10" fill="#f85149"/><text x="32" y="44" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="34" font-weight="bold" fill="#0b0e12">X</text><text x="100" y="44" font-family="ui-sans-serif,sans-serif" font-size="34" fill="#cdd6f4">contradicted</text></g>
  <rect x="0" y="701" width="1920" height="379" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="701" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">First, we say out loud, in advance, how sure we actually are. We use six honest labels —</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">running from established at the top, down through hypothesis and interpretation, all the</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">way to contradicted at the bottom. Every claim we make gets exactly one of them, pinned to</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">it in plain sight. And no claim, however beloved, is ever allowed to quietly skip the</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">line.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">पहिले, आपण आधीच, उघडपणे सांगतो की आपण खरोखर किती खात्रीशीर आहोत. आपण सहा प्रामाणिक</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">खुणा वापरतो — वर स्थापित पासून, गृहीतक आणि अर्थ यांतून, अगदी खाली खोडलेल्या</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">पर्यंत. आपण करत असलेल्या प्रत्येक दाव्याला त्यातली नेमकी एक मिळते, उघडपणे जोडलेली.</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि कोणताही दावा, कितीही प्रिय असो, गुपचूप रांग वगळू शकत नाही.</text>
</svg>