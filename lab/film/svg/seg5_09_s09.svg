<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g8" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g8)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="84" letter-spacing="6" fill="#e6edf3" font-weight="bold">THIS WORLD</text>
  <rect x="660" y="420" width="600" height="3" fill="#f38ba8" opacity="0.55"/>
  <text x="960" y="500" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#9aa7b4" letter-spacing="3">is closer to midnight than to noon</text>
  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And now, since we have come this far together, I want to speak to you for a moment about</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">why we made this film at all — and what it has to do with the world we are all sharing</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">tonight. Because the world we live in, just now, is closer to midnight than to noon. There</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">is more weaponry, and more fear, and more shouting on the public square than there has</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">been in any of our lifetimes.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि आता, आपण इथपर्यंत एकत्र आलो आहोत म्हणून, मला तुम्हाला क्षणभर सांगायचे आहे की</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आपण हा चित्रपट का बनवला — आणि त्याचा आज रात्री आपण सर्व सामायिक करत असलेल्या जगाशी</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">काय संबंध आहे. कारण आपण आत्ता जगतो ते जग दुपारपेक्षा मध्यरात्रीच्या जवळ आहे.</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आपल्यापैकी कोणाच्याही जीवनात कधीही नव्हते इतके शस्त्र, इतकी भीती, आणि सार्वजनिक</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">चौकात इतके ओरडणे आहे.</text>
</svg>