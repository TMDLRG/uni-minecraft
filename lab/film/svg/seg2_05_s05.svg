<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g4" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#0c111e"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g4)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="140" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="4">how ozone is born — the Chapman cycle (1930)</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="32" fill="#cdd6f4">
    <rect x="320" y="220" width="1280" height="90" rx="12" fill="#1c2128" stroke="#cba6f7" stroke-width="2"/>
    <text x="960" y="278" text-anchor="middle">O₂  +  UV light  →  O  +  O</text>
    <text x="1620" y="278" font-size="24" fill="#6c7393">(split)</text>

    <rect x="320" y="330" width="1280" height="90" rx="12" fill="#1c2128" stroke="#a6e3a1" stroke-width="2"/>
    <text x="960" y="388" text-anchor="middle">O  +  O₂  →  O₃</text>
    <text x="1620" y="388" font-size="24" fill="#6c7393">(form)</text>

    <rect x="320" y="440" width="1280" height="90" rx="12" fill="#1c2128" stroke="#89dceb" stroke-width="2"/>
    <text x="960" y="498" text-anchor="middle">O₃  +  UV light  →  O₂  +  O</text>
    <text x="1620" y="498" font-size="24" fill="#6c7393">(shield)</text>

    <rect x="320" y="550" width="1280" height="90" rx="12" fill="#1c2128" stroke="#f9e2af" stroke-width="2"/>
    <text x="960" y="608" text-anchor="middle">O  +  O₃  →  O₂  +  O₂</text>
    <text x="1620" y="608" font-size="24" fill="#6c7393">(close)</text>
  </g>
  <rect x="0" y="667" width="1920" height="413" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="667" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">Where does it come from? From sunlight, mostly. High in the upper atmosphere, ultraviolet</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">light hits ordinary oxygen and breaks it apart. The loose oxygen atoms find their way back</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">to oxygen molecules and join up, three at a time, into ozone. Then more ultraviolet light</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">breaks the ozone apart again. This little dance is called the Chapman cycle, and it has</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">been running over our heads for billions of years.</text>
  <rect x="800" y="869" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ते कुठून येते? बहुतेक सूर्यप्रकाशातून. उच्च वातावरणात उंचावर, अतिनील किरण साध्या</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">ऑक्सिजनवर आदळून त्याचे तुकडे करतात. सुटे ऑक्सिजन अणू पुन्हा ऑक्सिजन रेणूंशी जुळतात</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि तीन-तीन एकत्र येऊन ओझोन बनतात. मग अधिक अतिनील किरण पुन्हा ओझोनचे तुकडे करतात.</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">या छोट्या नृत्याला चॅपमन चक्र म्हणतात, आणि ते आपल्या डोक्यावर अब्जावधी वर्षांपासून</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">चालू आहे.</text>
</svg>