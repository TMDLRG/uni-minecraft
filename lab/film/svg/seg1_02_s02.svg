<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g1" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#1a1822"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g1)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <ellipse cx="960" cy="640" rx="1100" ry="80" fill="#f9e2af" opacity="0.07"/><ellipse cx="960" cy="640" rx="700" ry="40" fill="#fab387" opacity="0.10"/>
  <g fill="#6c7393" opacity="0.7"><circle cx="380" cy="560" r="6"/><rect x="378" y="566" width="4" height="20" rx="2"/><circle cx="560" cy="550" r="7"/><rect x="557" y="557" width="6" height="24" rx="2"/><circle cx="760" cy="568" r="6"/><rect x="758" y="574" width="4" height="20" rx="2"/><circle cx="980" cy="545" r="8"/><rect x="976" y="553" width="8" height="26" rx="2"/><circle cx="1180" cy="562" r="6"/><rect x="1178" y="568" width="4" height="20" rx="2"/><circle cx="1380" cy="552" r="7"/><rect x="1377" y="559" width="6" height="24" rx="2"/></g>
  <rect x="0" y="770" width="1920" height="310" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="770" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="826" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">And the way a traveler makes sense of the world is always the same. We receive signals</text>
  <text x="960" y="865" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">from outside us. We interpret them, as best we can, against everything we have already</text>
  <text x="960" y="904" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">learned. And then we act — and the world answers back, and we learn again.</text>
  <rect x="800" y="918" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="962" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">आणि प्रवासी जगाचा अर्थ कसा लावतो ते नेहमी सारखेच असते. आपल्या बाहेरून आपल्याला</text>
  <text x="960" y="1002" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">संकेत मिळतात. आपण ते, जमेल तितके, आधी शिकलेल्या सगळ्याशी ताडून पाहतो. आणि मग आपण</text>
  <text x="960" y="1042" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">कृती करतो — आणि जग उत्तर देते, आणि आपण पुन्हा शिकतो.</text>
</svg>