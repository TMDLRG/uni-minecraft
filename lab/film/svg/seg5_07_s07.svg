<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g6" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#13111c"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g6)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="54" fill="#cdd6f4" font-style="italic">"The gift is the way of looking."</text>
  
  <rect x="0" y="599" width="1920" height="481" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="599" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="651" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">The gift is the way of looking. It is the small, stubborn, humane discipline that lets a</text>
  <text x="960" y="685" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">hopeful idea be tested without being humiliated, and lets a beautiful idea be wrong</text>
  <text x="960" y="719" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">without being shamed. It is the practice of saying, out loud, how sure we are; of stating</text>
  <text x="960" y="753" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">our bar before our run; of comparing to the best we already have; of believing the answer</text>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">the math gives even when we wanted a different one. That is not a procedure. It is, in the</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">deepest sense, a way of being.</text>
  <rect x="800" y="835" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="875" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">भेट म्हणजे पाहण्याची पद्धत. ती एक छोटी, हट्टी, मानवी शिस्त आहे जी आशादायक कल्पनेला</text>
  <text x="960" y="909" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">अपमानित न करता तपासू देते, आणि सुंदर कल्पनेला लाजवल्याशिवाय चुकू देते. ती उघडपणे,</text>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आपण किती खात्रीशीर आहोत हे सांगण्याची प्रथा आहे; चाचणीआधी आपली रेषा सांगण्याची;</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आपल्याकडे आधीच असलेल्या सर्वोत्तमशी तुलना करण्याची; आपल्याला वेगळे उत्तर हवे</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">असतानाही गणित देणारे उत्तर मानण्याची. ती प्रक्रिया नाही. ती, सर्वात खोल अर्थाने,</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">असण्याचा एक मार्ग आहे.</text>
</svg>