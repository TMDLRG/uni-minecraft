<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g9" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g9)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <text x="960" y="150" text-anchor="middle" font-family="ui-sans-serif,sans-serif" font-size="36" fill="#9aa7b4" letter-spacing="4">three bold proposals</text>
  <g font-family="ui-sans-serif,sans-serif">
  <rect x="110" y="240" width="540" height="340" rx="14" fill="#1c2128" stroke="#89dceb" stroke-width="2"/><text x="380" y="320" text-anchor="middle" font-size="28" fill="#89dceb" letter-spacing="3">OZONE</text><text x="380" y="410" text-anchor="middle" font-size="32" fill="#e6edf3">the source of life?</text><text x="380" y="480" text-anchor="middle" font-size="22" fill="#6c7393">a shield — or something more</text>
  <rect x="690" y="240" width="540" height="340" rx="14" fill="#1c2128" stroke="#f9e2af" stroke-width="2"/><text x="960" y="320" text-anchor="middle" font-size="28" fill="#f9e2af" letter-spacing="3">PRESSURE</text><text x="960" y="410" text-anchor="middle" font-size="32" fill="#e6edf3">the source of weight?</text><text x="960" y="480" text-anchor="middle" font-size="22" fill="#6c7393">not mass, but the press of air</text>
  <rect x="1270" y="240" width="540" height="340" rx="14" fill="#1c2128" stroke="#a6e3a1" stroke-width="2"/><text x="1540" y="320" text-anchor="middle" font-size="28" fill="#a6e3a1" letter-spacing="3">PLANETS</text><text x="1540" y="410" text-anchor="middle" font-size="32" fill="#e6edf3">a great machine?</text><text x="1540" y="480" text-anchor="middle" font-size="22" fill="#6c7393">gears of solar engineering</text>
  </g>
  <rect x="0" y="735" width="1920" height="345" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="735" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="787" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">And out of one person's wondering came three bold answers. That the ozone in our sky is</text>
  <text x="960" y="821" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">not just a filter, but something close to the very source of life. That the weight pinning</text>
  <text x="960" y="855" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">us to the ground comes not from mass at all, but from the press of the air. And that the</text>
  <text x="960" y="889" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="28" fill="#e6edf3">planets are not a loose scatter of rock and fire, but a single great machine.</text>
  <rect x="800" y="903" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="943" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">आणि एका व्यक्तीच्या आश्चर्यातून तीन धाडसी उत्तरे आली. की आपल्या आकाशातील ओझोन केवळ</text>
  <text x="960" y="977" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">गाळणी नाही, तर जीवनाच्या मूळ स्रोताच्या जवळचे काहीतरी आहे. की आपल्याला जमिनीला</text>
  <text x="960" y="1011" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">खिळवून ठेवणारे वजन वस्तुमानातून मुळीच नाही, तर हवेच्या दाबातून येते. आणि की ग्रह</text>
  <text x="960" y="1045" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="26" fill="#cdd6f4">म्हणजे खडक-अग्नीचा विखुरलेला ढग नाही, तर एकच मोठे यंत्र आहे.</text>
</svg>