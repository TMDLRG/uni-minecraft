<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><defs><radialGradient id="g7" cx="50%" cy="36%" r="82%"><stop offset="0%" stop-color="#11151f"/><stop offset="100%" stop-color="#0b0e14"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#g7)"/><g fill="#cdd6f4" opacity="0.5"><circle cx="180" cy="120" r="1.4"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="150" r="1.5"/><circle cx="900" cy="60" r="1.1"/><circle cx="1180" cy="180" r="1.3"/><circle cx="1420" cy="100" r="1.6"/><circle cx="1700" cy="220" r="1.4"/><circle cx="240" cy="380" r="1.1"/><circle cx="520" cy="320" r="1.5"/><circle cx="860" cy="280" r="1.2"/><circle cx="1320" cy="400" r="1"/><circle cx="1620" cy="470" r="1.3"/><circle cx="120" cy="560" r="1.2"/><circle cx="1040" cy="540" r="1.4"/><circle cx="1780" cy="600" r="1.1"/></g>
  <g transform="translate(960,600)" fill="#3b3450" opacity="0.85"><ellipse cx="0" cy="0" rx="170" ry="36"/><path d="M -74 -20 L -74 -240 Q -74 -276 -38 -276 L 38 -276 Q 74 -276 74 -240 L 74 -20 Z"/><circle cx="0" cy="-304" r="38"/></g>
  <g stroke="#89b4fa" stroke-width="2" fill="none" opacity="0.4"><circle cx="960" cy="180" r="58"/><circle cx="1080" cy="150" r="32"/><circle cx="840" cy="160" r="38"/></g>
  <rect x="0" y="770" width="1920" height="310" fill="#05070b" opacity="0.88"/>
  <rect x="0" y="770" width="1920" height="3" fill="#89b4fa" opacity="0.5"/>
  <text x="960" y="826" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">Why do worlds hold the things they hold? Why doesn't the air just drift away into space?</text>
  <text x="960" y="865" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">Why does the thin blue sky above us shield our skin from a Sun that should burn it? What,</text>
  <text x="960" y="904" text-anchor="middle" font-family="ui-sans-serif,'Segoe UI',sans-serif" font-size="32" fill="#e6edf3">underneath everything, is life — and where on earth, or off it, did we come from?</text>
  <rect x="800" y="918" width="320" height="2" fill="#89b4fa" opacity="0.3"/>
  <text x="960" y="962" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">जग ज्या गोष्टी धारण करतात त्या का? हवा अवकाशात निघून का जात नाही? आपल्यावरचे पातळ</text>
  <text x="960" y="1002" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">निळे आकाश आपली त्वचा अशा सूर्यापासून का वाचवते जो ती जाळायला हवा? सर्वांखाली, जीवन</text>
  <text x="960" y="1042" text-anchor="middle" font-family="Nirmala UI,'Mangal','Noto Sans Devanagari',sans-serif" font-size="30" fill="#cdd6f4">म्हणजे काय — आणि आपण कुठून आलो, या पृथ्वीवरून की तिच्या पलीकडून?</text>
</svg>