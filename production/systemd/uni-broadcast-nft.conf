# uni-broadcast-nft.conf - LiveKit guest-ingest nftables rules for the broadcast node.
#
# DESIGN/REFERENCE, status: pending (authored, not yet run on node hardware).
#
# Scope: ONLY the LiveKit (uni-bcast-livekit) guest-ingest ports need a public/WAN-facing
# rule. Every other broadcast surface on this node is loopback-only by existing convention
# (obs-websocket 4455, mediamtx API 9997, overlays 8099, captions 8501, prod-mcp 8095) and
# gets NO rule here - see production/docs/DEPLOY.md section 7 ("nftables - open the
# broadcast ports") for the full inbound-dport convention this file follows.
#
# Do NOT add a rule for :8095 (production-MCP) in this file. It stays loopback-only per
# DEPLOY.md section 7b / uni-production-mcp.service - nginx is its only client, and nginx
# proxies it internally. Opening :8095 to the WAN would bypass that containment.
#
# These three ports are the ONLY LiveKit-related ports that need a public rule:
#   tcp dport 7880          - LiveKit signalling (ws/http). Guest join.html / stage.html
#                              connect here first to negotiate the WebRTC session.
#   tcp dport 7881          - LiveKit rtc-tcp fallback, used when a guest's network blocks
#                              UDP outright (hotel wifi, restrictive corporate NAT, etc).
#   udp dport 50000-50200   - LiveKit rtc-udp media range. The actual audio/video RTP/RTCP
#                              traffic once a session is negotiated; this is the wide range
#                              because each participant's media flows use ephemeral ports
#                              inside it.
#
# These rules apply to the trusted chain (per DEPLOY.md's pattern) on the WAN-facing
# interface, alongside the existing 7b rules for 1935/8890 (mixer -> relay ingest). They
# must be applied through the uni-lab MCP (mutating os_*/podman_* calls there pause for
# exactly ONE human approval - CLAUDE.md Method-of-work #3) and persisted to
# /etc/nftables.conf so they survive a reboot, matching every other broadcast-node rule.

# --- in table inet filter, chain trusted (WAN-facing interface) ---------------------------
tcp dport 7880 accept              # LiveKit signalling ws/http (remote guests).
tcp dport 7881 accept              # LiveKit rtc-tcp fallback.
udp dport 50000-50200 accept       # LiveKit rtc-udp media range.

# Apply (mutating - dry-run then confirm through the uni-lab MCP, exactly ONE human approval):
#
#   nft add rule inet filter trusted tcp dport 7880 accept
#   nft add rule inet filter trusted tcp dport 7881 accept
#   nft add rule inet filter trusted udp dport 50000-50200 accept
#
# Persist by appending the same three lines to the `trusted` chain in /etc/nftables.conf,
# then:
#
#   nft -f /etc/nftables.conf
#
# Note: this file intentionally does NOT restate the forward-chain requirement (DEPLOY.md
# 7a, `iifname "podman0" accept` / `oifname "podman0" ct state established,related accept`)
# or the mixer->relay loopback preference (DEPLOY.md 7b closing note) - those are general
# node conventions, not specific to LiveKit, and already live in DEPLOY.md. This file is
# scoped to the guest-ingest ports only, per the file list for this authoring pass.
