# dnsmasq.uni.conf — UNI fleet authoritative unicast resolver for the uni-lab.local zone.
# DNS-ONLY (the Linksys router keeps DHCP). Runs as the `uni-dns` quadlet (network=host) on
# uni-lab. avahi stays running for host zeroconf — this is ADDITIVE, avahi is not removed.
#
# WHY unicast dnsmasq and not mDNS: mDNS (.local multicast) cannot cross the WireGuard mesh or
# Tailscale, and cannot answer for podman containers — this resolver can (adversarial M5).

port=53
# hygiene: reject malformed / non-routable-private reverse lookups upstream
domain-needed
bogus-priv

# ── the zone ────────────────────────────────────────────────────────────────────────────────
domain=uni-lab.local
local=/uni-lab.local/            # answer uni-lab.local AUTHORITATIVELY, never forward it upstream
expand-hosts                     # a bare `mc` in the hosts file becomes mc.uni-lab.local
localise-queries                 # multi-homed names: return the A on the querier's own subnet (M3)
addn-hosts=/etc/uni/dns/uni-lab.local.hosts
no-hosts                         # serve ONLY our map — do NOT read the box's /etc/hosts

# ── bind SURGICALLY so we never collide with aardvark-dns on the podman bridge gateways ──────
# aardvark owns 10.89.x.1 / 10.90.x.1 / 10.91.x.1 :53. bind-dynamic listens only on the
# addresses below (and picks wg0 up when it comes online) WITHOUT a wildcard bind and WITHOUT
# hard-failing if 10.13.13.1 is momentarily absent (M-resilience over plain bind-interfaces).
bind-dynamic
listen-address=127.0.0.1
interface=eno4                   # LAN plane: follow the interface, not a transient IP (self-net 2026-07-15).
                                 # The chip's external LAN IP is a disposable uplink; bind-dynamic tracks
                                 # whatever address eno4 currently holds, so a DHCP move never blinds the LAN.
listen-address=10.13.13.1
# drop privileges after binding :53
user=nobody
group=nogroup

# ── upstream forward chain (preserve the current path); do NOT read /etc/resolv.conf ─────────
# (we are about to BE the box's resolver — reading resolv.conf would create a loop)
no-resolv
server=10.190.245.188
server=1.1.1.1
server=9.9.9.9

# ── rebind protection, with the internal zone + localhost exempted ───────────────────────────
stop-dns-rebind
rebind-domain-ok=/uni-lab.local/
rebind-localhost-ok

# ── cache + logging ──────────────────────────────────────────────────────────────────────────
cache-size=1000
# query logging is OFF by default (noise + privacy). Uncomment to debug resolution:
# log-queries=extra
# log-facility is set to stderr (journald via podman) by the quadlet Exec line.
