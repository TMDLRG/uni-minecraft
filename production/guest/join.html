<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>UNI Broadcast - Guest Green Room</title>
<!--
  join.html - LiveKit guest join page for the UNI Production Platform.
  Authored against docs/UNI_PRODUCTION_PLATFORM.md (uni-bcast-livekit, ws :7880; green-room -> on-air model).

  Flow:
    1. Read ?token= (the minted green-room JWT) and ?room= (advisory; the token claim is authoritative).
    2. Connect to LiveKit, publish local cam+mic into the GREEN ROOM (off air).
    3. Show a local preview tile, a mic level meter, and camera/mic device pickers.
    4. Wait. The host sees/hears us. On admit_guest (human-gated, server-side) the server hands us an
       on-air token over the LiveKit data channel; we re-connect into the on-air room and show ON AIR.

  Status: DESIGN / reference. Not deployed. In-broadcast behavior is pending confirmation on a real run.
-->
<!-- SRI: real SHA-384 of the vendored livekit-client 2.5.7 UMD (production/overlays/vendor/), computed 2026-07-12 from cdn.jsdelivr.net; see that dir's README.md for provenance -->
<script src="/vendor/livekit-client-2.5.7.umd.min.js" integrity="sha384-8MchKu+uhKf1LR8KGk472KudVHw8lg9vmXj/XW6mPzWLSXlVTlnW/+oJixUtGYbX" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0b0f16; --panel:#121826; --line:#22304a; --ink:#e8eef7; --muted:#8aa0bd;
    --ok:#3ddc84; --warn:#ffcc4d; --bad:#ff6b6b; --air:#ff3b3b; --accent:#4da3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card{
    width:100%; max-width:760px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; overflow:hidden;
  }
  header{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px}
  header h1{font-size:16px; margin:0; font-weight:600}
  .badge{margin-left:auto; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700;
    letter-spacing:.4px; background:#1d2740; color:var(--muted); border:1px solid var(--line)}
  .badge.green{color:var(--ok); border-color:#1e6b43}
  .badge.air{color:#fff; background:var(--air); border-color:var(--air); animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .stage{position:relative; aspect-ratio:16/9; background:#000}
  video{width:100%; height:100%; object-fit:cover; display:block; transform:scaleX(-1)}
  video.no-mirror{transform:none}
  .overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; text-align:center; padding:20px; pointer-events:none}
  .overlay .dot{width:12px;height:12px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite}
  .overlay .msg{color:var(--ink); font-weight:600; max-width:440px}
  .overlay .sub{color:var(--muted); font-size:13px; max-width:440px}
  .hidden{display:none !important}
  .controls{padding:14px 18px; display:grid; gap:12px}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px}
  select,button{font:inherit; color:var(--ink); background:#0e1422; border:1px solid var(--line);
    border-radius:8px; padding:9px 11px}
  select{min-width:200px; flex:1}
  .field{flex:1; min-width:200px}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  .meter{height:12px; background:#0e1422; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .meter > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));
    transition:width .06s linear}
  .meterwrap{flex:1; min-width:200px}
  .foot{padding:10px 18px; border-top:1px solid var(--line); color:var(--muted); font-size:12px;
    display:flex; gap:10px; align-items:center; justify-content:space-between}
  .err{color:var(--bad)}
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>UNI Broadcast - Guest</h1>
    <span id="badge" class="badge">CONNECTING</span>
  </header>

  <div class="stage">
    <video id="local" autoplay playsinline muted></video>
    <div id="ovWaiting" class="overlay">
      <span class="dot"></span>
      <div class="msg">You are in the green room.</div>
      <div class="sub">The host can see and hear you. Waiting to go on air. You are not yet on the live broadcast.</div>
    </div>
    <div id="ovConnecting" class="overlay">
      <span class="dot"></span>
      <div class="msg">Connecting...</div>
      <div class="sub">Setting up your camera and microphone.</div>
    </div>
    <div id="ovError" class="overlay hidden">
      <div class="msg err" id="errMsg">Something went wrong.</div>
      <div class="sub" id="errSub"></div>
    </div>
  </div>

  <div class="controls">
    <div class="row">
      <div class="field">
        <label for="camSel">Camera</label>
        <select id="camSel"></select>
      </div>
      <div class="field">
        <label for="micSel">Microphone</label>
        <select id="micSel"></select>
      </div>
    </div>
    <div class="row">
      <div class="meterwrap">
        <label>Mic level (speak to check)</label>
        <div class="meter"><i id="meterBar"></i></div>
      </div>
      <button id="retryBtn" class="hidden">Retry</button>
    </div>
  </div>

  <div class="foot">
    <span id="status">Reading invite...</span>
    <span id="stale"></span>
  </div>
</div>

<script>
(function(){
  "use strict";
  const LK = window.LivekitClient || window.LiveKitClient;
  const qs = new URLSearchParams(location.search);
  // The LiveKit ws URL. Default to the master-doc contract (uni-bcast-livekit ws :7880) on this host.
  // Overridable via ?ws= for dev. TODO: confirm the externally-reachable ws origin for remote guests.
  // Unconditionally wss:// - this carries live cam/mic media; never fall back to plaintext ws://.
  const WS_URL = qs.get("ws") || "wss://" + location.hostname + ":7880";
  let token = qs.get("token") || "";
  let roomHint = qs.get("room") || "greenroom";

  const el = (id)=>document.getElementById(id);
  const badge = el("badge"), statusEl = el("status"), staleEl = el("stale");
  const localVideo = el("local"), camSel = el("camSel"), micSel = el("micSel"), meterBar = el("meterBar");
  const ovWaiting = el("ovWaiting"), ovConnecting = el("ovConnecting"), ovError = el("ovError");
  const errMsg = el("errMsg"), errSub = el("errSub"), retryBtn = el("retryBtn");

  let room = null;            // current LiveKit Room
  let camTrack = null, micTrack = null;
  let audioCtx = null, analyser = null, meterRAF = 0;
  let onAir = false;

  function setBadge(text, cls){ badge.textContent = text; badge.className = "badge" + (cls ? " " + cls : ""); }
  function show(node){ node.classList.remove("hidden"); }
  function hide(node){ node.classList.add("hidden"); }
  function setOverlay(which){
    [ovWaiting, ovConnecting, ovError].forEach(hide);
    if(which) show(which);
  }
  function fail(msg, sub){
    errMsg.textContent = msg || "Something went wrong.";
    errSub.textContent = sub || "";
    setOverlay(ovError);
    show(retryBtn);
    setBadge("OFFLINE");
    statusEl.textContent = msg || "Error";
  }

  if(!token){
    fail("This invite is missing its token.", "Ask the host for a new join link.");
    return;
  }
  if(typeof LK === "undefined"){
    fail("Could not load the LiveKit client library.", "Check your connection and Retry. (CDN load failed.)");
    return;
  }

  // ---- device enumeration ---------------------------------------------------
  async function listDevices(){
    let devs = [];
    try { devs = await navigator.mediaDevices.enumerateDevices(); } catch(_){ return; }
    fillSelect(camSel, devs.filter(d=>d.kind==="videoinput"), "Camera");
    fillSelect(micSel, devs.filter(d=>d.kind==="audioinput"), "Microphone");
    const sc = localStorage.getItem("uni.guest.cam"); if(sc) camSel.value = sc;
    const sm = localStorage.getItem("uni.guest.mic"); if(sm) micSel.value = sm;
  }
  function fillSelect(sel, devs, label){
    const cur = sel.value;
    sel.innerHTML = "";
    devs.forEach((d,i)=>{
      const o = document.createElement("option");
      o.value = d.deviceId;
      o.textContent = d.label || (label + " " + (i+1));
      sel.appendChild(o);
    });
    if(cur) sel.value = cur;
  }

  // ---- mic level meter (Web Audio AnalyserNode; no WebGL) --------------------
  function startMeter(mediaStreamTrack){
    stopMeter();
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(new MediaStream([mediaStreamTrack]));
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      const tick = ()=>{
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for(let i=0;i<buf.length;i++){ const v = (buf[i]-128)/128; sum += v*v; }
        const rms = Math.sqrt(sum / buf.length);          // 0..~1
        const pct = Math.min(100, Math.round(rms * 180));  // visual gain
        meterBar.style.width = pct + "%";
        meterRAF = requestAnimationFrame(tick);
      };
      tick();
    } catch(_){ /* meter is best-effort */ }
  }
  function stopMeter(){
    if(meterRAF) cancelAnimationFrame(meterRAF), meterRAF = 0;
    if(audioCtx){ try{ audioCtx.close(); }catch(_){}; audioCtx = null; analyser = null; }
  }

  // ---- acquire / publish local tracks --------------------------------------
  async function acquireAndPublish(){
    const camId = camSel.value || undefined, micId = micSel.value || undefined;
    // create tracks via the LiveKit SDK so we can publish + republish on device change
    const tracks = await LK.createLocalTracks({
      audio: micId ? { deviceId: micId } : true,
      video: camId ? { deviceId: camId, resolution: LK.VideoPresets.h720.resolution } : true
    });
    // detach old
    if(camTrack){ try{ await room.localParticipant.unpublishTrack(camTrack); camTrack.stop(); }catch(_){} }
    if(micTrack){ try{ await room.localParticipant.unpublishTrack(micTrack); micTrack.stop(); }catch(_){} }
    camTrack = tracks.find(t=>t.kind === "video") || null;
    micTrack = tracks.find(t=>t.kind === "audio") || null;
    if(camTrack){
      camTrack.attach(localVideo);
      await room.localParticipant.publishTrack(camTrack);
    }
    if(micTrack){
      await room.localParticipant.publishTrack(micTrack);
      const mst = micTrack.mediaStreamTrack;
      if(mst) startMeter(mst);
    }
  }

  async function changeDevices(){
    localStorage.setItem("uni.guest.cam", camSel.value || "");
    localStorage.setItem("uni.guest.mic", micSel.value || "");
    if(room && room.state === "connected"){
      statusEl.textContent = "Switching devices...";
      try { await acquireAndPublish(); statusEl.textContent = onAir ? "On air." : "In the green room."; }
      catch(e){ fail("Could not switch devices.", String(e && e.message || e)); }
    }
  }
  camSel.addEventListener("change", changeDevices);
  micSel.addEventListener("change", changeDevices);

  // ---- connect --------------------------------------------------------------
  async function connect(tok, isOnAir){
    setOverlay(ovConnecting);
    setBadge("CONNECTING");
    statusEl.textContent = "Connecting to the broadcast...";

    if(room){ try{ await room.disconnect(); }catch(_){} room = null; }

    room = new LK.Room({ adaptiveStream: true, dynacast: true });

    // The server signals admission by sending an on-air token over the data channel.
    room.on(LK.RoomEvent.DataReceived, (payload)=>{
      try {
        const txt = new TextDecoder().decode(payload);
        const msg = JSON.parse(txt);
        if(msg && msg.type === "admit" && msg.token){
          goOnAir(msg.token);
        } else if(msg && msg.type === "remove"){
          goGreenRoom(msg.token || null);
        }
      } catch(_){ /* ignore non-JSON control messages */ }
    });

    room.on(LK.RoomEvent.Disconnected, ()=>{
      if(!onAir){ setBadge("OFFLINE"); statusEl.textContent = "Disconnected. Retry to rejoin."; show(retryBtn); }
    });

    await room.connect(WS_URL, tok);
    await listDevices();              // labels are available after permission/connect
    await acquireAndPublish();

    onAir = !!isOnAir;
    if(onAir){
      setBadge("ON AIR", "air");
      setOverlay(null);
      statusEl.textContent = "You are ON AIR.";
    } else {
      setBadge("GREEN ROOM", "green");
      setOverlay(ovWaiting);
      statusEl.textContent = "In the green room. Waiting for the host to admit you.";
    }
    hide(retryBtn);
  }

  async function goOnAir(onAirToken){
    token = onAirToken;
    await connect(onAirToken, true);
  }
  async function goGreenRoom(greenToken){
    if(greenToken) token = greenToken;
    await connect(token, false);
  }

  retryBtn.addEventListener("click", ()=>{ hide(retryBtn); start(); });

  async function start(){
    try {
      // Prompt for permissions early so device labels populate and the preview works.
      try {
        const probe = await navigator.mediaDevices.getUserMedia({ audio:true, video:true });
        probe.getTracks().forEach(t=>t.stop());
      } catch(permErr){
        fail("Camera/microphone access is blocked.",
             "Allow camera and microphone in your browser, then press Retry.");
        return;
      }
      await listDevices();
      await connect(token, false);
    } catch(e){
      const m = String(e && e.message || e);
      if(/expired|invalid|token|permission denied/i.test(m)){
        fail("This invite has expired or was already used.", "Ask the host for a new join link.");
      } else {
        fail("Could not join the broadcast.", m);
      }
    }
  }

  // staleness/diagnostic footer (honest): show the room we believe we are in.
  staleEl.textContent = "room: " + roomHint;
  if(navigator.mediaDevices && navigator.mediaDevices.addEventListener){
    navigator.mediaDevices.addEventListener("devicechange", listDevices);
  }

  start();
})();
</script>
</body>
</html>
