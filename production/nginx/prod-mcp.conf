# production/nginx/prod-mcp.conf  --  the broadcast-node operator web surface (Phase X, broadcast-lane half)
#
# STATUS: /prod-mcp DEPLOYED + PROVEN LIVE on uni-lab-79740c 2026-07-12. Behavioral gate through nginx:
#   /prod-mcp -> 401 (routes to the fail-closed production-MCP :8095), and the existing front is intact
#   (/mcp -> 401, / -> 200, /status/ -> 403). See production/docs/receipts/nginx_prod_mcp_2026-07-12.md.
#
# HOW IT WAS ACTUALLY DEPLOYED (the DEPLOY.md "drop a location in conf.d" recipe is WRONG for this node):
#   this node's /etc/nginx/nginx.conf includes conf.d/*.conf at the HTTP level, so a bare `location`
#   there is invalid. The real operator vhost is /etc/nginx/sites-available/uni-ssl.conf (:443 ssl,
#   server_name "uni-lab.local _"), symlinked from sites-enabled/. The `location /prod-mcp` block below
#   was inserted INTO that server{} (right after the existing /mcp -> :8090 block it mirrors), a
#   .bak-preprodmcp backup taken first, then `systemctl reload nginx` + the behavioral probe above.
#
# SAFETY finding (verified, not assumed): that nginx fronts ONLY the UNI/lab surface (/api->:8000,
# /mcp->:8090 fleet-MCP, /glass, /approvals, /status) -- it does NOT proxy the co-hosted SolutionWright
# business stack (swo-* on :8710/:3110/:6432, portainer :9443 have their own ingress), so this change
# did not touch the never-mutate business stack.
#
# This file is the committed reference for the /prod-mcp block (+ optional /overlays/ + /vendor/ for a
# unified front). The /control LiveView target is the COLONY lane's cross-system hand-off (their Phoenix
# :4000), configured once that route lands -- see the note at the foot.

# --- Production MCP: the streamable-HTTP control endpoint -------------------------------------------
# Token-gated INSIDE the app; the upstream is loopback-only on :8095 (:8094 is uni-glass-configure on
# this node). MCP streamable-HTTP is chunked HTTP/SSE, NOT a WebSocket upgrade -- so we must NOT force
# `Connection: upgrade`.
location /prod-mcp {
    proxy_pass http://127.0.0.1:8095/prod-mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The MCP streamable transport's DNS-rebinding protection only accepts a 127.0.0.1 Host. Forward the
    # upstream's own authority (not the external $host) so a real client at http://<node>/prod-mcp is
    # accepted instead of rejected 421. nginx is the only client of :8095.
    proxy_set_header Host 127.0.0.1:8095;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- Overlays static + the no-store state alias ----------------------------------------------------
# (Use this only if you prefer nginx to the in-container Caddy on :8099. The deployed overlays are
# served by the uni-bcast-overlays Caddy already; this alias is for a single unified front.)
location /overlays/ {
    proxy_pass http://127.0.0.1:8099/overlays/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

# --- Vendored on-air JS (the SRI-pinned LiveKit client) --------------------------------------------
# NOTE: this requires the vendored file to be present in the overlays' served root on the node
# (production/overlays/vendor/livekit-client-2.5.7.umd.min.js -> the node's overlays dir). That ship
# step is still pending (Phase VII on-node). Until then this location 404s -- fail-closed, honest.
location /vendor/ {
    proxy_pass http://127.0.0.1:8099/vendor/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# --- Operator control surface ----------------------------------------------------------------------
# control.html (production/control/control.html) calls MCP_BASE=/prod-mcp above. The Phoenix LiveView
# `/control` (router.ex + control_live.ex) is the COLONY lane's hand-off and runs on the UI/colony host
# (SP.Producer Phoenix, :4000), NOT on this broadcast node -- so a /control proxy target is cross-system
# and belongs to whoever runs that Phoenix endpoint. Left unconfigured here on purpose: wire it to the
# reachable Phoenix authority once the LiveView lands, e.g.
#   location /control { proxy_pass http://<colony-phoenix-authority>/control; ... WebSocket upgrade ... }
