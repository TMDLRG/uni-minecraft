<!doctype html>
<meta charset="utf-8" />
<title>UNI LAB — L5, the desk</title>
<!--
  L5: THE DESK, AND THE RUN UNDER WAY. Phase 9 step 4.6, build 5.

  Stand at a gate and read EXACTLY what would be written, before it is. Not a mock-up of the row —
  the bytes, in the schema's property order, the same string SP.ControlPlane.GateRow.encode/1 would
  emit. The L5 gate runs the Elixir on the same row and compares, because a preview that drifts from
  the writer is worse than no preview.

  TWO ROWS, NEVER ONE. The BEFORE row is complete and honest and says PENDING, which is the schema's
  own word for "registered but not run". The AFTER row cannot exist until something has run: there is
  no field here for a verdict you would like. A desk that showed a PASS before the run would have
  pre-registered a conclusion.

  AND THE FLOOR IS THE FINDING AGAIN. Every registered gate is a station on this floor, and NONE of
  them has a row in the canonical ledger — whose own schema says every gate the project claims MUST
  be represented there. The record has never heard of one of them. The counts are NOT written here:
  they are computed by theGap() on every request and rendered from the payload, because the first
  version of this comment said "24" and the registry grew to 25 in the same change that wrote it.

  Press R at a station and the gate actually runs — in a throwaway worktree at HEAD, never your
  working tree, so it cannot touch what you are in the middle of AND it answers the question a run in
  your own tree cannot: "running, but not the committed bytes."

  NOTHING HERE WRITES THE LEDGER. S4. The desk shows the line and stops.
-->
<style>
  :root { --ink:#e8eef2; --dim:#7c8b96; --floor:#141b21; --line:#1e2a33; --you:#7fd1c4;
          --absent:#d8b46a; --present:#7fd1c4; --refused:#5b6a75; --bad:#c96a6a;
          --pane:rgba(16,22,27,.95); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0a0f13; color:var(--ink); overflow:hidden;
              font:12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; left:14px; top:12px; pointer-events:none; }
  #hud h1 { margin:0 0 2px; font-size:13px; letter-spacing:.14em; font-weight:600; }
  #hud p { margin:0; color:var(--dim); }
  #desk { position:fixed; right:0; top:0; bottom:0; width:min(620px,50vw); background:var(--pane);
          border-left:1px solid var(--line); padding:14px 16px; overflow:auto; display:none; }
  #desk h2 { margin:0 0 2px; font-size:13px; letter-spacing:.08em; }
  #desk h3 { margin:16px 0 4px; font-size:11px; letter-spacing:.14em; color:var(--dim); font-weight:600; }
  .row { background:#0b1116; border-left:3px solid var(--dim); padding:8px 10px; margin:4px 0;
         white-space:pre-wrap; word-break:break-all; color:#cfe4ef; }
  .row.before { border-left-color:var(--absent); }
  .row.after  { border-left-color:var(--present); }
  .note { color:var(--dim); margin:6px 0; }
  .blocker { color:var(--absent); margin:3px 0 3px 0; padding-left:12px; border-left:2px solid var(--absent); }
  .no { color:var(--refused); font-style:italic; }
  kbd { background:#1e2a33; border-radius:3px; padding:1px 5px; color:var(--ink); }
  #out { background:#070b0e; border-left:3px solid var(--line); padding:8px 10px; margin:4px 0;
         white-space:pre-wrap; max-height:38vh; overflow:auto; color:#9fb6c4; display:none; }
  #gap { position:fixed; left:14px; bottom:12px; width:min(700px,46vw); color:var(--dim);
         border-left:3px solid var(--absent); padding:8px 12px; background:rgba(20,27,33,.9); }
  #gap b { color:var(--absent); }
</style>

<canvas id="c"></canvas>
<div id="hud"><h1>UNI LAB · L5</h1><p>the desk — walk to a gate, read what would be written · <kbd>R</kbd> runs it</p></div>
<div id="desk"></div>
<div id="gap">…</div>

<script>
  "use strict";
  const ROOM = { w: 44, h: 30 };
  const you = { x: 22, y: 27 };
  const target = { x: null, y: null };
  const keys = new Set();
  let STATIONS = [], GAP = null, HERE = null, PANEL = null, RUNNING = false;

  const c = document.getElementById("c");
  const g = c.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = c.clientWidth; H = c.clientHeight;
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize);

  function view() {
    const s = Math.min(W / (ROOM.w * 1.9), H / (ROOM.h * 1.3));
    return { s, ox: W * 0.30, oy: H / 2 - ROOM.h * s * 0.12 };
  }
  const iso = (x, y) => { const { s, ox, oy } = view();
    return [ox + (x - ROOM.w/2) * s * .75 - (y - ROOM.h/2) * s * .75,
            oy + (x - ROOM.w/2) * s * .38 + (y - ROOM.h/2) * s * .38]; };
  function unIso(px, py) { const { s, ox, oy } = view();
    const a = (px - ox) / (s * .75), b = (py - oy) / (s * .38);
    return [(a + b) / 2 + ROOM.w/2, (b - a) / 2 + ROOM.h/2]; }
  function line(x1,y1,x2,y2){const[a,b]=iso(x1,y1),[d,e]=iso(x2,y2);g.beginPath();g.moveTo(a,b);g.lineTo(d,e);g.stroke();}
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function floor() {
    g.beginPath();
    [[0,0],[ROOM.w,0],[ROOM.w,ROOM.h],[0,ROOM.h]].forEach(([x,y],i)=>{const[a,b]=iso(x,y);i?g.lineTo(a,b):g.moveTo(a,b);});
    g.closePath(); g.fillStyle = cssVar("--floor"); g.fill();
    g.strokeStyle = cssVar("--line"); g.lineWidth = 1; g.globalAlpha = .45;
    for (let x = 2; x < ROOM.w; x += 2) line(x, 0, x, ROOM.h);
    for (let y = 2; y < ROOM.h; y += 2) line(0, y, ROOM.w, y);
    g.globalAlpha = 1;
  }

  // A desk, drawn as a desk. SOLID top when the canonical ledger has a row for this gate; HOLLOW,
  // outline-only, when it does not — which today is all of them, and is the finding rather than a
  // rendering fault.
  function drawStation(st) {
    const [px, py] = iso(st.x, st.y); const { s } = view();
    const w = s * 2.1, h = s * 0.9;
    const rim = st.in_ledger ? cssVar("--present") : cssVar("--absent");

    g.beginPath(); g.ellipse(px, py, w * .5, w * .2, 0, 0, Math.PI * 2);
    g.fillStyle = "rgba(0,0,0,.4)"; g.fill();

    const top = [[px - w/2, py - h], [px, py - h - w*.26], [px + w/2, py - h], [px, py - h + w*.26]];
    g.beginPath(); top.forEach(([a,b],i)=>i?g.lineTo(a,b):g.moveTo(a,b)); g.closePath();
    if (st.in_ledger) { g.fillStyle = "rgba(127,209,196,.22)"; g.fill(); }
    g.strokeStyle = st.runnable ? rim : cssVar("--refused");
    g.lineWidth = HERE && HERE.id === st.id ? 2.4 : 1.2;
    if (!st.in_ledger) g.setLineDash([5, 4]);
    g.stroke(); g.setLineDash([]);

    g.beginPath(); g.moveTo(px, py - h + w*.26); g.lineTo(px, py); g.stroke();   // the leg

    if (HERE && HERE.id === st.id) {
      g.fillStyle = cssVar("--ink"); g.font = "11px ui-monospace, monospace"; g.textAlign = "center";
      g.fillText(st.id, px, py + s * .95);
      g.textAlign = "left";
    }
  }

  function drawYou() {
    const [px,py] = iso(you.x, you.y); const { s } = view();
    g.beginPath(); g.ellipse(px, py, s*.42, s*.22, 0, 0, Math.PI*2);
    g.fillStyle = "rgba(0,0,0,.45)"; g.fill();
    g.beginPath(); g.moveTo(px, py - s*1.15); g.lineTo(px + s*.3, py); g.lineTo(px - s*.3, py);
    g.closePath(); g.fillStyle = cssVar("--you"); g.fill();
  }

  addEventListener("keydown",(e)=>{
    const k = e.key.toLowerCase();
    if (k === "r") { runHere(); e.preventDefault(); return; }
    keys.add(k); if ("wasd".includes(k)) { target.x = null; e.preventDefault(); }
  });
  addEventListener("keyup",(e)=>keys.delete(e.key.toLowerCase()));
  c.addEventListener("click",(e)=>{const r=c.getBoundingClientRect();const[x,y]=unIso(e.clientX-r.left,e.clientY-r.top);
    target.x=Math.max(.6,Math.min(ROOM.w-.6,x)); target.y=Math.max(.6,Math.min(ROOM.h-.6,y));});

  function step(dt) {
    const sp = keys.has("shift") ? 15 : 7.5;
    let dx=0, dy=0;
    if(keys.has("w")){dx-=1;dy-=1;} if(keys.has("s")){dx+=1;dy+=1;}
    if(keys.has("a")){dx-=1;dy+=1;} if(keys.has("d")){dx+=1;dy-=1;}
    if(dx||dy){const m=Math.hypot(dx,dy); you.x+=dx/m*sp*dt; you.y+=dy/m*sp*dt;}
    else if(target.x!==null){const ax=target.x-you.x,ay=target.y-you.y,d=Math.hypot(ax,ay);
      if(d<.15)target.x=null; else {you.x+=ax/d*sp*dt; you.y+=ay/d*sp*dt;}}
    you.x=Math.max(.6,Math.min(ROOM.w-.6,you.x)); you.y=Math.max(.6,Math.min(ROOM.h-.6,you.y));
  }

  function nearest() {
    let best = null, bd = 3.0;
    for (const st of STATIONS) {
      const d = Math.hypot(st.x - you.x, st.y - you.y);
      if (d < bd) { bd = d; best = st; }
    }
    if ((best && best.id) !== (HERE && HERE.id)) { HERE = best; PANEL = null; showDesk(); }
  }

  const esc = (s) => String(s).replace(/[&<>]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));

  async function showDesk() {
    const el = document.getElementById("desk");
    if (!HERE) { el.style.display = "none"; return; }
    el.style.display = "block";
    if (!PANEL) {
      el.innerHTML = "<h2>" + esc(HERE.id) + "</h2><p class='note'>reading…</p>";
      PANEL = await (await fetch("/api/lab/desk?gate=" + encodeURIComponent(HERE.id))).json();
    }
    const b = PANEL.before || {};
    el.innerHTML =
      "<h2>" + esc(HERE.id) + "</h2>" +
      "<p class='note'>gate_row <b>" + esc(HERE.gate_row) + "</b> · " +
      (HERE.in_ledger ? "in the canonical ledger, verdict " + esc(HERE.ledger_verdict)
                      : "<b style='color:var(--absent)'>NO ROW IN THE CANONICAL LEDGER</b>") + "</p>" +

      "<h3>THE ROW THAT WOULD BE WRITTEN, BEFORE IT IS</h3>" +
      "<div class='row before'>" + esc(b.encoded || "") + "</div>" +
      "<p class='note'>" + esc(b.what_cannot_be_known_yet || "") + "</p>" +
      (b.blockers && b.blockers.length
        ? "<h3>AND IT COULD NOT BE APPENDED TODAY</h3>" +
          b.blockers.map((x) => "<div class='blocker'>" + esc(x) + "</div>").join("")
        : "<p class='note'>schema-valid, receipt on disk — this one could be appended as it stands.</p>") +

      "<h3>THE ROW AFTER THE RUN</h3>" +
      (PANEL.no_result
        ? "<div class='row' style='border-left-color:var(--bad)'>NO ROW. " + esc(PANEL.no_result.why) + "</div>" +
          (PANEL.no_result.note ? "<p class='note'>" + esc(PANEL.no_result.note) + "</p>" : "") +
          "<p class='note'>outcome <b>" + esc(PANEL.no_result.outcome) + "</b> — not a verdict, and " +
          "deliberately not shaped like one. A question that could not be asked must never wear the " +
          "same word as an answer of no.</p>"
        : "") +
      (PANEL.after
        ? "<div class='row after'>" + esc(PANEL.after.encoded) + "</div>" +
          "<p class='note'>" + esc(PANEL.after.derivation) + "</p>" +
          "<p class='note'>" + esc(PANEL.after.evidence_class_note) + "</p>" +
          // The AFTER row's blockers, rendered exactly like the BEFORE row's. Omitting them was the
          // defect: every after-row the page can produce carries an empty receipt_path, and showing
          // it with no blockers read as "this one is ready to append". It is not.
          (PANEL.after.blockers && PANEL.after.blockers.length
            ? "<p class='note'><b>AND IT COULD NOT BE APPENDED AS IT STANDS</b></p>" +
              PANEL.after.blockers.map((x) => "<div class='blocker'>" + esc(x) + "</div>").join("")
            : "<p class='note'>schema-valid, receipt on disk — this one could be appended as it stands.</p>") +
          "<p class='note' style='color:var(--absent)'>" + esc(PANEL.after.and_it_is_not_written) + "</p>"
        : "<p class='no'>" + esc((PANEL.after_refusal && PANEL.after_refusal.why) || "") + "</p>" +
          "<p class='note'>" + (PANEL.may_run && PANEL.may_run.allowed
            ? "Press <kbd>R</kbd> to run it — in a throwaway worktree at HEAD, not your working tree."
            : "<b style='color:var(--refused)'>" + esc((PANEL.may_run && PANEL.may_run.code) || "") + "</b> — " +
              esc((PANEL.may_run && PANEL.may_run.why) || "")) + "</p>") +

      "<div id='out'></div>";
    if (PANEL.output) { const o = document.getElementById("out"); o.style.display = "block"; o.textContent = PANEL.output; }
  }

  async function runHere() {
    if (!HERE || RUNNING || !PANEL || !(PANEL.may_run && PANEL.may_run.allowed)) return;
    RUNNING = true;
    const o = document.getElementById("out");
    o.style.display = "block"; o.textContent = "";
    const res = await fetch("/api/lab/run", {
      // `x-uni-cc: 1` is this repository's CSRF fence (command_center.cjs:1579, ADR-PROD-015). It and
      // the JSON content-type each force a CORS preflight, so no other page in the browser can fire
      // this route as a simple request or as a plain <form>.
      method: "POST", headers: { "content-type": "application/json", "x-uni-cc": "1" },
      body: JSON.stringify({ gate: HERE.id }),
    });
    if (!res.ok) { o.textContent = "REFUSED " + res.status + " — " + (await res.text()); RUNNING = false; return; }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", tail = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n"); buf = parts.pop();
      for (const p of parts) {
        if (p.startsWith("␀RESULT ")) { tail = p.slice(8); continue; }
        o.textContent += p + "\n"; o.scrollTop = o.scrollHeight;
      }
    }
    RUNNING = false;
    if (tail) {
      const r = JSON.parse(tail);
      PANEL.after = r.after;
      // A RUN THAT PRODUCED NO RESULT SAYS SO, HERE, WHERE THE VERDICT WOULD HAVE BEEN.
      // The observation used to be discarded entirely, so a child killed by the timeout reached this
      // page as a confident FAIL row with no trace of the kill anywhere a reader would look.
      PANEL.no_result = r.observed && r.observed.no_verdict_because
        ? { why: r.observed.no_verdict_because, note: r.observed.note, outcome: r.observed.outcome }
        : null;
      PANEL.output = o.textContent;
      await showDesk();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now-last)/1000, .05); last = now;
    step(dt); nearest();
    g.clearRect(0,0,W,H);
    floor();
    [...STATIONS].sort((a,b)=>a.x+a.y-(b.x+b.y)).forEach(drawStation);
    drawYou();
    requestAnimationFrame(frame);
  }

  fetch("/api/lab/stations").then((r)=>r.json()).then((j)=>{
    STATIONS = j.stations; GAP = j.gap;
    document.getElementById("gap").innerHTML =
      "<b>" + GAP.registered + " REGISTERED GATES · " + GAP.in_the_canonical_ledger +
      " IN THE CANONICAL LEDGER.</b> " + esc(GAP.so) + " " + esc(GAP.what_the_schema_says) +
      " <b>Why it has stayed that way:</b> " + esc(GAP.why_it_has_stayed_that_way);
  }).catch(()=>{ document.getElementById("gap").textContent = "the desk is not answering"; });

  resize();
  requestAnimationFrame(frame);
</script>
