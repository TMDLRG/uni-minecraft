<!doctype html>
<meta charset="utf-8" />
<title>UNI LAB — L3, the projection</title>
<!--
  L3: THE PROJECTION. Real state, real receipts, 1 Hz, diff-suppressed. Phase 9 step 4.6, build 3.

  THE FLOOR IS ENTIRELY FOG, AND THAT IS THE FINDING — not a rendering fault.

  The plan expected "the ones with missing receipts standing in fog". Measured: 109 gates, 109
  receipts present, ZERO missing. Every gate is fog for a different reason: the gate ledger carries
  no `truth_class` and its schema forbids one (`additionalProperties: false`), so F24 renders every
  node without one as fog.

  evidence_class (A/B/C/Sec/pending) says how STRONG the evidence is. truth_class
  (OBSERVED/STRUCTURAL_RECONSTRUCTION/REDUCED_MODEL/DERIVED/SIMULATED) says what KIND of thing it
  is. Mapping one onto the other would relabel a strength as a kind — truth laundering — so nothing
  here does it, and the room says so on screen rather than leaving you to wonder if it broke.

  1 Hz AND DIFF-SUPPRESSED. A surface that redraws an unchanged world every second teaches you that
  motion means nothing, and then real motion goes unnoticed. The server hashes the projection and
  answers `unchanged`; this page keeps what it has and says when it last actually moved.
-->
<style>
  :root { --ink:#e8eef2; --dim:#7c8b96; --floor:#141b21; --line:#1e2a33; --you:#7fd1c4; --fog:#4a5a66;
          --warn:#d8b46a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0a0f13; color:var(--ink);
              font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; left:14px; top:12px; pointer-events:none; }
  #hud h1 { margin:0 0 2px; font-size:13px; letter-spacing:.14em; font-weight:600; }
  #hud p { margin:0; color:var(--dim); }
  #right { position:fixed; right:14px; top:12px; text-align:right; color:var(--dim); pointer-events:none; }
  #right b { color:var(--ink); font-weight:600; }
  #why { position:fixed; left:14px; bottom:12px; right:14px; max-width:none; color:var(--dim);
         border-left:3px solid var(--warn); padding:8px 12px; background:rgba(20,27,33,.85); }
  #why b { color:var(--warn); }
  #near { position:fixed; right:14px; bottom:12px; text-align:right; color:var(--ink);
          background:rgba(20,27,33,.9); padding:8px 12px; border-left:3px solid var(--fog); display:none; }
</style>

<canvas id="c"></canvas>
<div id="hud"><h1>UNI LAB · L3</h1><p>the projection — real gates, 1 Hz, diff-suppressed</p></div>
<div id="right"><b id="count">reading…</b><br /><span id="moved">—</span><br /><span id="boot">boot …</span></div>
<div id="near"></div>
<div id="why">…</div>

<script>
  "use strict";
  const ROOM = { w: 44, h: 34 };
  const you = { x: 22, y: 31 };
  const target = { x: null, y: null };
  const keys = new Set();
  let NODES = [];
  let lastMoved = null;

  const c = document.getElementById("c");
  const g = c.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = c.clientWidth; H = c.clientHeight;
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize);

  function view() {
    const s = Math.min(W / (ROOM.w * 1.55), H / (ROOM.h * 1.15));
    return { s, ox: W / 2, oy: H / 2 - ROOM.h * s * 0.20 };
  }
  const iso = (x, y) => { const { s, ox, oy } = view();
    return [ox + (x - ROOM.w/2) * s * .75 - (y - ROOM.h/2) * s * .75,
            oy + (x - ROOM.w/2) * s * .38 + (y - ROOM.h/2) * s * .38]; };
  function unIso(px, py) { const { s, ox, oy } = view();
    const a = (px - ox) / (s * .75), b = (py - oy) / (s * .38);
    return [(a + b) / 2 + ROOM.w/2, (b - a) / 2 + ROOM.h/2]; }
  function line(x1,y1,x2,y2){const[a,b]=iso(x1,y1),[d,e]=iso(x2,y2);g.beginPath();g.moveTo(a,b);g.lineTo(d,e);g.stroke();}
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function floor() {
    g.beginPath();
    [[0,0],[ROOM.w,0],[ROOM.w,ROOM.h],[0,ROOM.h]].forEach(([x,y],i)=>{const[a,b]=iso(x,y);i?g.lineTo(a,b):g.moveTo(a,b);});
    g.closePath(); g.fillStyle = cssVar("--floor"); g.fill();
    g.strokeStyle = cssVar("--line"); g.lineWidth = 1; g.globalAlpha = .5;
    for (let x = 2; x < ROOM.w; x += 2) line(x, 0, x, ROOM.h);
    for (let y = 2; y < ROOM.h; y += 2) line(0, y, ROOM.w, y);
    g.globalAlpha = 1;
  }

  // The five forms are L1's, unchanged. L3 supplies real nodes; it invents no new way to draw one.
  function drawNode(n) {
    const [px, py] = iso(n.x, n.y);
    const { s } = view();
    const w = s * 1.5, h = s * 2.0;

    if (n.material === "fog") {
      const grd = g.createRadialGradient(px, py - h*.35, s*.15, px, py - h*.35, w*.95);
      grd.addColorStop(0, "rgba(74,90,102,.5)"); grd.addColorStop(1, "rgba(74,90,102,0)");
      g.fillStyle = grd;
      g.beginPath(); g.ellipse(px, py - h*.35, w*.95, h*.55, 0, 0, Math.PI*2); g.fill();
      return;
    }
    g.beginPath(); g.ellipse(px, py, w*.42, w*.20, 0, 0, Math.PI*2);
    g.fillStyle = "rgba(0,0,0,.45)"; g.fill();
    const body = [[px-w/2,py],[px+w/2,py],[px+w/2,py-h],[px-w/2,py-h]];
    g.beginPath(); body.forEach(([a,b],i)=>i?g.lineTo(a,b):g.moveTo(a,b)); g.closePath();
    g.fillStyle = n.material === "lit_solid" ? "#cfe4ef"
                : n.material === "seamed_solid" ? "#9fb6c4"
                : n.material === "translucent" ? "rgba(111,150,171,.3)" : "transparent";
    g.fill(); g.strokeStyle = "#33454f"; g.lineWidth = 1.2; g.stroke();
  }

  function drawYou() {
    const [px,py] = iso(you.x, you.y); const { s } = view();
    g.beginPath(); g.ellipse(px, py, s*.42, s*.22, 0, 0, Math.PI*2);
    g.fillStyle = "rgba(0,0,0,.45)"; g.fill();
    g.beginPath(); g.moveTo(px, py - s*1.15); g.lineTo(px + s*.3, py); g.lineTo(px - s*.3, py);
    g.closePath(); g.fillStyle = cssVar("--you"); g.fill();
  }

  // Standing next to a node tells you what it IS — including, honestly, that it has no truth_class.
  function nearest() {
    let best = null, bd = 2.4;
    for (const n of NODES) {
      const d = Math.hypot(n.x - you.x, n.y - you.y);
      if (d < bd) { bd = d; best = n; }
    }
    const el = document.getElementById("near");
    if (!best) { el.style.display = "none"; return; }
    el.style.display = "block";
    el.innerHTML =
      "<b>" + best.id + "</b><br />" +
      "verdict " + best.verdict + " · evidence_class " + best.evidence_class + "<br />" +
      "truth_class <b style='color:var(--warn)'>" + (best.truth_class || "ABSENT") + "</b> → material " + best.material + "<br />" +
      "receipt " + (best.receipt_on_disk ? "on disk" : "NOT ON DISK") + "<br />" +
      "<span style='color:var(--dim)'>" + (best.receipt_named || "none named") + "</span>";
  }

  addEventListener("keydown",(e)=>{keys.add(e.key.toLowerCase()); if("wasd".includes(e.key.toLowerCase())){target.x=null;e.preventDefault();}});
  addEventListener("keyup",(e)=>keys.delete(e.key.toLowerCase()));
  c.addEventListener("click",(e)=>{const r=c.getBoundingClientRect();const[x,y]=unIso(e.clientX-r.left,e.clientY-r.top);
    target.x=Math.max(.6,Math.min(ROOM.w-.6,x)); target.y=Math.max(.6,Math.min(ROOM.h-.6,y));});

  function step(dt) {
    const sp = keys.has("shift") ? 15 : 7.5;
    let dx=0, dy=0;
    if(keys.has("w")){dx-=1;dy-=1;} if(keys.has("s")){dx+=1;dy+=1;}
    if(keys.has("a")){dx-=1;dy+=1;} if(keys.has("d")){dx+=1;dy-=1;}
    if(dx||dy){const m=Math.hypot(dx,dy); you.x+=dx/m*sp*dt; you.y+=dy/m*sp*dt;}
    else if(target.x!==null){const ax=target.x-you.x,ay=target.y-you.y,d=Math.hypot(ax,ay);
      if(d<.15)target.x=null; else {you.x+=ax/d*sp*dt; you.y+=ay/d*sp*dt;}}
    you.x=Math.max(.6,Math.min(ROOM.w-.6,you.x)); you.y=Math.max(.6,Math.min(ROOM.h-.6,you.y));
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now-last)/1000, .05); last = now;
    step(dt);
    g.clearRect(0,0,W,H);
    floor();
    [...NODES].sort((a,b)=>a.x+a.y-(b.x+b.y)).forEach(drawNode);
    drawYou(); nearest();
    requestAnimationFrame(frame);
  }

  // 1 Hz. The server answers `unchanged` when nothing moved, and this keeps what it has — the
  // whole point of diff suppression is that a still world stays still on screen too.
  async function tick() {
    try {
      const r = await fetch("/api/lab/live");
      const j = await r.json();
      if (j.changed) {
        NODES = j.nodes || [];
        lastMoved = new Date();
        document.getElementById("count").textContent =
          NODES.length + " gates · " + j.why_fog.fogged + " in fog";
        document.getElementById("why").innerHTML =
          "<b>THE FLOOR IS ENTIRELY FOG, AND THAT IS THE FINDING.</b> " +
          j.why_fog.fogged + " of " + j.why_fog.of + " gates · " +
          j.why_fog.missing_receipt + " with a missing receipt. " + j.why_fog.reason +
          "<br /><b>Closing it:</b> " + j.why_fog.closing_it;
      }
      if (lastMoved) {
        const s = Math.round((Date.now() - lastMoved) / 1000);
        document.getElementById("moved").textContent = "last changed " + s + "s ago";
      }
    } catch { document.getElementById("count").textContent = "the projection is not answering"; }
  }

  resize();
  requestAnimationFrame(frame);
  tick();
  setInterval(tick, 1000);
  fetch("/api/identity").then((r)=>r.json()).then((i)=>{
    document.getElementById("boot").textContent = "boot " + String(i.boot_git_commit||"?").slice(0,7);
  }).catch(()=>{});
</script>
