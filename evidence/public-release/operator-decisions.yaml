  transcript_archive_disposition:
    decision: RETAIN_PRIVATE_CLEAN_PUBLIC_SPLIT
    operator_words: >-
      "no, it does not need to be in any public repo it MUST be retained.
       keep all the repos AS IS and private and make NEW public repos that are clean"
    approved_by: michael
    approved_at: 2026-08-01
    legal_or_contract_review: NOT_REQUIRED_BY_THIS_ROUTE
    rationale: >-
      The archive never enters a public repository, so the client-contract question that would
      otherwise require counsel does not arise for the release. It is retained in full, privately.
    consequences:
      - NO history rewrite anywhere. No filter-repo, no filter-branch, no force-push, no rebase of
        published history. THE MOST DANGEROUS OPERATION IN THE PLAN IS REMOVED.
      - No protected-backup-then-destroy sequence is needed, because nothing is destroyed.
      - The existing repos are UNTOUCHED and STAY PRIVATE. They remain the working repos.
      - Public repos are NEW and are initialised EMPTY. They must never be created by cloning,
        forking, or pushing an existing private repo, because that would carry the contaminated
        history with it. `git init` in a fresh directory, files copied in as content.
      - "BLOCKER-1 is resolved BY CONSTRUCTION rather than by remediation, and the gate that proves
         it changes shape - it must now prove ABSENCE IN A NEW HISTORY, which is a far stronger and
         cheaper property than proving successful excision from an old one."
    verification_required:
      - every public repo's FULL reachable history contains zero objects originating from a private
        repo's history
      - no public repo has a remote, ref, tag or note pointing at a private repo
      - the archive paths are unreachable in every public working tree AND object database

  repository_model:
    decision: NEW_CLEAN_PUBLIC_REPOS_ALONGSIDE_UNTOUCHED_PRIVATE_ONES
    operator_words: >-
      "keep all the repos AS IS and private and make NEW public repos that are clean"
    approved_by: michael
    approved_at: 2026-08-01
    consequences:
      - "Two-tier estate - PRIVATE working repos (source of truth) + PUBLIC clean repos (published)."
      - A SYNC MECHANISM is now mandatory and is the central engineering problem of this project.
        It did not exist under the "publish the existing repo" model.
      - Every sync is a PUBLICATION EVENT and must pass the safety gate before it lands.

  site_architecture:
    decision: OWN_VERCEL_SITE_LINKED_FROM_TWO_DOMAINS
    operator_words: >-
      "This must be landed fully as its own Vercel site(s) and be accessible through the navigation
       and exposed through the UniversalNaturalIntelligence.com site and linked from the
       EducateWright.com site to get people to the UniveralNaturalIntelligence site"
    approved_by: michael
    approved_at: 2026-08-01
    resolves: >-
      Jules Stage 5 asked for a measured ruling between extending the existing docs engine in place,
      extracting it, or building separately. The operator chose separately. This also routes around
      BLOCKER 1 — a new app in a new repo inherits no contaminated history.
    remaining_question: >-
      WHICH components of the existing Next.js docs engine are extracted and reused, not WHETHER.
      Stage 5 measurement continues, narrowed.
    referral_topology:
      publish_at: universalnaturalintelligence.com   # exposed through its navigation
      referral_from: educatewright.com                # links TO the UNI site
      note: >-
        BOTH target repos are PRIVATE today and educatewright CARRIES THE ARCHIVE. Linking is a
        content change to those sites; it does not require publishing them.

