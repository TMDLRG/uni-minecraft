  public_source_citation_model:
    decision: null
    approved_by: null
    approved_at: null
    blocks:
      - the citation system (requirement R3), and therefore most of the site's evidentiary value
    why_this_is_now_urgent: >-
      THIS IS THE CONSEQUENCE OF THE NEW-PUBLIC-REPO DECISION AND IT MAY NOT HAVE BEEN OBVIOUS.
      R3 requires "real source code citation" resolving to repo + commit SHA + path + line range. A
      citation can only resolve for a reader if THE CITED SOURCE IS IN A PUBLIC REPO. Under the old
      model the source was the published repo, so this was free. It is no longer free.
    options:
      - id: mirror-the-spine-source
        what: >-
          The public repos carry the actual cleaned SOURCE of the spine subsystems, synced from the
          private repos. Citations resolve directly.
        cost: continuous sync of real code; every sync is a publication event needing the safety gate
        gives: full evidentiary value; genuine open source; real contribution possible
      - id: docs-only-with-excerpts
        what: >-
          Public repos carry documentation and quoted excerpts only. Citations name a private path
          and cannot be followed by a reader.
        cost: low
        gives: >-
          WEAK. A citation nobody can open is an appeal to authority, which is the opposite of this
          estate's evidentiary culture. It would also make "open source" inaccurate.
      - id: hybrid
        what: >-
          Spine subsystems published as real source; everything else documented with unresolvable
          references EXPLICITLY MARKED as private-source.
        cost: medium
        gives: honest, incremental, and matches the spine scope ruling
    agent_recommendation: >-
      hybrid, with the private-source marking made visible and machine-checkable so no page can imply
      an unverifiable claim is verifiable. But the scope of what becomes genuinely open is the
      operator's call, not mine.

